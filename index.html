var G={W:640,H:400,L:66,R:22,T:22,B:62};
G.pw=G.W-G.L-G.R;G.ph=G.H-G.T-G.B;
function X(x){return G.L+x/10*G.pw}
function Y(y){return G.T+G.ph-y/10*G.ph}
function baseSvg(c,label,ys){
  var g='',k=ys||1;
  for(var i=0;i<=10;i++){
    g+='<line class="gl" x1="'+X(i)+'" y1="'+Y(0)+'" x2="'+X(i)+'" y2="'+Y(10)+'"/>';
    g+='<line class="gl" x1="'+X(0)+'" y1="'+Y(i)+'" x2="'+X(10)+'" y2="'+Y(i)+'"/>';
    if(i%2===0){
      g+='<text class="tk" x="'+X(i)+'" y="'+(Y(0)+18)+'" text-anchor="middle">'+i+'</text>';
      g+='<text class="tk" x="'+(X(0)-9)+'" y="'+(Y(i)+4)+'" text-anchor="end">'+(i*k)+'</text>';
    }
  }
  g+='<line class="ax" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(10)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(10)+'"/>';
  g+='<text class="al" x="'+X(5)+'" y="'+(G.H-16)+'" text-anchor="middle">'+c.x+'</text>';
  g+='<text class="al" transform="translate(16 '+Y(5)+') rotate(-90)" text-anchor="middle">'+c.y+'</text>';
  return '<svg viewBox="0 0 '+G.W+' '+G.H+'" role="img" aria-label="'+label+'" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="plot"><rect x="'+G.L+'" y="'+G.T+'" width="'+G.pw+'" height="'+G.ph+'"/></clipPath></defs>'+g;
}
function slopeShell(){
  var c=CTX[state.track];
  return '<div class="wrap" id="w-slope">'+baseSvg(c,'Graph with two draggable points, A and B, and the line through them')+
    '<g clip-path="url(#plot)"><line class="sec" id="sl"/><path class="tri" id="tri"/></g>'+
    '<text class="annot" id="runT" text-anchor="middle"></text><text class="annot" id="riseT"></text>'+
    '<circle class="pt" id="pa" r="11" tabindex="0" aria-label="Point A. Use the arrow keys to move it."/>'+
    '<circle class="pt" id="pb" r="11" tabindex="0" aria-label="Point B. Use the arrow keys to move it."/>'+
    '<text class="lab" id="la" text-anchor="middle">A</text><text class="lab" id="lb" text-anchor="middle">B</text></svg></div>'+
    '<div class="readout" id="ro-slope" aria-live="polite"></div>';
}
function initSlope(){
  var root=$('#w-slope');if(!root)return;
  var c=CTX[state.track],svg=$('svg',root);
  var pa=$('#pa'),pb=$('#pb'),sl=$('#sl'),tri=$('#tri'),runT=$('#runT'),riseT=$('#riseT'),la=$('#la'),lb=$('#lb'),ro=$('#ro-slope');
  var A={x:2,y:2},B={x:7,y:8},drag=null;
  function snap(v){return Math.min(10,Math.max(0,Math.round(v*2)/2))}
  function toData(e){
    var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    var p=pt.matrixTransform(svg.getScreenCTM().inverse());
    return {x:snap((p.x-G.L)/G.pw*10),y:snap((G.T+G.ph-p.y)/G.ph*10)};
  }
  function draw(){
    pa.setAttribute('cx',X(A.x));pa.setAttribute('cy',Y(A.y));
    pb.setAttribute('cx',X(B.x));pb.setAttribute('cy',Y(B.y));
    la.setAttribute('x',X(A.x));la.setAttribute('y',Y(A.y)-18);
    lb.setAttribute('x',X(B.x));lb.setAttribute('y',Y(B.y)-18);
    var dx=B.x-A.x,dy=B.y-A.y;
    if(dx===0){
      sl.setAttribute('x1',X(A.x));sl.setAttribute('x2',X(A.x));sl.setAttribute('y1',Y(0));sl.setAttribute('y2',Y(10));
    }else{
      var m=dy/dx;
      sl.setAttribute('x1',X(0));sl.setAttribute('y1',Y(A.y-m*A.x));
      sl.setAttribute('x2',X(10));sl.setAttribute('y2',Y(A.y+m*(10-A.x)));
    }
    tri.setAttribute('d','M'+X(A.x)+' '+Y(A.y)+' L'+X(B.x)+' '+Y(A.y)+' L'+X(B.x)+' '+Y(B.y));
    runT.setAttribute('x',X((A.x+B.x)/2));runT.setAttribute('y',Y(A.y)+(dy<0?-8:19));
    runT.textContent=dx===0?'':'run = '+num(dx)+' '+c.xu;
    var right=B.x>8.5;
    riseT.setAttribute('x',X(B.x)+(right?-9:9));riseT.setAttribute('text-anchor',right?'end':'start');
    riseT.setAttribute('y',Y((A.y+B.y)/2)+4);
    riseT.textContent=dy===0?'':'rise = '+num(dy)+' '+c.yu;
    if(dx===0){ro.innerHTML='<p class="eq">The run is 0, so the slope is undefined.</p><p class="sub">Drag a point sideways to give the line a run.</p>'}
    else{ro.innerHTML='<p class="eq">slope = rise ÷ run = '+num(dy)+' ÷ '+num(dx)+' = '+num(dy/dx,2)+' '+c.unit+'</p><p class="sub">'+(dy/dx>0?'The output grows as the input grows.':(dy/dx<0?'The output drops as the input grows.':'The output stays flat.'))+'</p>'}
  }
  function bind(el,pt){
    el.addEventListener('pointerdown',function(e){drag=pt;el.setPointerCapture(e.pointerId);e.preventDefault()});
    el.addEventListener('pointermove',function(e){if(drag!==pt)return;var d=toData(e);pt.x=d.x;pt.y=d.y;draw()});
    var end=function(){drag=null};
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
    el.addEventListener('keydown',function(e){
      var k=e.key,dxm=0,dym=0;
      if(k==='ArrowLeft')dxm=-.5;else if(k==='ArrowRight')dxm=.5;else if(k==='ArrowUp')dym=.5;else if(k==='ArrowDown')dym=-.5;else return;
      e.preventDefault();pt.x=snap(pt.x+dxm);pt.y=snap(pt.y+dym);draw();
    });
  }
  bind(pa,A);bind(pb,B);draw();
}

function f(x){return .1*x*x}
function secantShell(){
  var c=CTX[state.track],d='';
  for(var x=0;x<=10.001;x+=.1){d+=(x===0?'M':'L')+X(x).toFixed(1)+' '+Y(f(x)).toFixed(1)+' '}
  return '<div class="wrap" id="w-sec">'+baseSvg(c,'A curve with a fixed point P and a second point Q that slides toward it')+
    '<path class="curve" d="'+d+'"/>'+
    '<g clip-path="url(#plot)"><line class="tan" id="tan"/><line class="sec" id="sec"/><path class="tri" id="tri2"/></g>'+
    '<circle class="pfix" id="pP" r="8"/><circle class="pt" id="pQ" r="9" style="cursor:default"/>'+
    '<text class="lab" id="lP" text-anchor="middle">P</text><text class="lab" id="lQ" text-anchor="middle">Q</text>'+
    '<text class="annot" id="hT" text-anchor="middle"></text></svg></div>'+
    '<ul class="legend"><li><svg viewBox="0 0 36 10"><line class="sec" x1="0" y1="5" x2="36" y2="5"/></svg>Line through P and Q</li>'+
    '<li><svg viewBox="0 0 36 10"><line class="tan" x1="0" y1="5" x2="36" y2="5"/></svg>Tangent at P (the target)</li></ul>'+
    '<div class="controls"><div><label for="x0">Where P sits on the curve</label><input id="x0" type="range" min="1" max="7" step="0.1" value="4"></div>'+
    '<div><label for="hs">Gap h between P and Q: <span id="hv"></span> '+c.xu+'</label><input id="hs" type="range" min="0" max="100" step="1" value="100"></div></div>'+
    '<div class="cta" style="margin-top:.25rem"><button class="btn small" id="play" type="button">Shrink h</button></div>'+
    '<div class="readout" id="ro-sec" aria-live="polite"></div>';
}
function initSecant(){
  var root=$('#w-sec');if(!root)return;
  var c=CTX[state.track];
  var x0s=$('#x0'),hs=$('#hs'),hv=$('#hv'),play=$('#play'),ro=$('#ro-sec');
  var tan=$('#tan'),sec=$('#sec'),tri=$('#tri2'),pP=$('#pP'),pQ=$('#pQ'),lP=$('#lP'),lQ=$('#lQ'),hT=$('#hT');
  function hOf(s){return .02+2.98*Math.pow(s/100,2)}
  function line(el,x0,m){
    var y0=f(x0);
    el.setAttribute('x1',X(0));el.setAttribute('y1',Y(y0-m*x0));
    el.setAttribute('x2',X(10));el.setAttribute('y2',Y(y0+m*(10-x0)));
  }
  function draw(){
    var x0=+x0s.value,h=hOf(+hs.value),x1=x0+h,y0=f(x0),y1=f(x1);
    var ms=(y1-y0)/h,md=.2*x0;
    pP.setAttribute('cx',X(x0));pP.setAttribute('cy',Y(y0));
    pQ.setAttribute('cx',X(x1));pQ.setAttribute('cy',Y(y1));
    lP.setAttribute('x',X(x0)-14);lP.setAttribute('y',Y(y0)+22);
    lQ.setAttribute('x',X(x1)+(h<.25?16:0));lQ.setAttribute('y',Y(y1)-16);
    line(tan,x0,md);line(sec,x0,ms);
    tri.setAttribute('d','M'+X(x0)+' '+Y(y0)+' L'+X(x1)+' '+Y(y0)+' L'+X(x1)+' '+Y(y1));
    hT.textContent=h>.5?'h = '+num(h,2)+' '+c.xu:'';
    hT.setAttribute('x',X(x0+h/2));hT.setAttribute('y',Y(y0)+19);
    hv.textContent=num(h,2);
    var near=Math.abs(ms-md)<.012;
    ro.innerHTML='<p class="eq">Slope between P and Q: '+num(ms,3)+' '+c.unit+'</p>'+
      '<p class="eq">Slope at P (the derivative): '+num(md,3)+' '+c.unit+'</p>'+
      '<p class="sub">'+(h<.15?'The two points are almost one point, so the slope between them is almost the derivative.':(near?'Close enough to read as the derivative.':'Slide h toward zero and watch the first number settle onto the second.'))+'</p>';
    play.textContent=(+hs.value<1)?'Reset h':'Shrink h';
  }
  function setS(v){hs.value=Math.round(v*10)/10;draw()}
  x0s.addEventListener('input',draw);hs.addEventListener('input',draw);
  play.addEventListener('click',function(){
    cancelAnimationFrame(ui.raf);
    if(+hs.value<1){setS(100);return}
    if(reduce){setS(0);return}
    var from=+hs.value,t0=performance.now(),dur=2800;
    function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,2);setS(from*(1-e));if(k<1)ui.raf=requestAnimationFrame(step)}
    ui.raf=requestAnimationFrame(step);
  });
  draw();
}

function limitShell(){

function initLimit(){

function limitPoint(root){
  var A=2,L=4;
  var rows1='<tr><th>x</th>',rows2='<tr><th>f(x)</th>';
  [1.9,1.99,1.999,2.001,2.01,2.1].forEach(function(x){rows1+='<td>'+x+'</td>';rows2+='<td>'+num(x+2,3)+'</td>'});
  root.innerHTML=baseSvg({x:'input x',y:'output f(x)'},'Graph of f(x) with a hole at x = 2 and a point that slides toward the hole')+
    '<path class="sec" d="M'+X(0)+' '+Y(2)+' L'+X(8)+' '+Y(10)+'"/><path class="tri" id="lm-g"/>'+
    '<circle class="hole" cx="'+X(A)+'" cy="'+Y(L)+'" r="7"/><circle class="pt" id="lm-m" r="9" style="cursor:default"/>'+
    '<text class="annot" x="'+(X(A)+14)+'" y="'+(Y(L)+22)+'">hole: f(2) is undefined</text></svg>'+
    '<div class="controls"><div><label for="lm-s">Slide x toward 2, from the left or the right</label><input id="lm-s" type="range" min="-100" max="100" step="1" value="-100"></div></div>'+
    '<div class="readout" id="ro-limit" aria-live="polite"></div>'+
    '<div class="tablewrap"><table class="mini"><tbody>'+rows1+'</tr>'+rows2+'</tr></tbody></table></div>';
  var s=$('#lm-s'),m=$('#lm-m'),g=$('#lm-g'),ro=$('#ro-limit');
  function draw(){
    var t=+s.value,sign=t<0?-1:1,d=sign*2*Math.pow(Math.abs(t)/100,2),x=A+d,y=x+2;
    if(t===0){
      m.setAttribute('display','none');g.setAttribute('d','');
      ro.innerHTML='<p class="eq">x = 2 exactly: the formula gives 0 ÷ 0, so f(2) is undefined.</p><p class="sub">The limit still exists. Slide off 2 on either side and watch what f(x) heads toward.</p>';
      return;
    }
    m.removeAttribute('display');
    m.setAttribute('cx',X(x));m.setAttribute('cy',Y(y));
    g.setAttribute('d','M'+X(x)+' '+Y(0)+' L'+X(x)+' '+Y(y)+' L'+X(0)+' '+Y(y));
    ro.innerHTML='<p class="eq">x = '+num(x,4)+', coming from the '+(t<0?'left':'right')+'</p><p class="eq">f(x) = '+num(y,4)+'</p><p class="sub">'+(Math.abs(d)<.05?'The output is almost 4. As x closes in on 2 from either side, f(x) closes in on 4.':'Keep sliding toward the middle and watch f(x).')+'</p>';
  }
  s.addEventListener('input',draw);draw();
}
function limitFar(root,c){
  var lim=c.lim,L=8;
  function yv(t){return 8*(1-Math.exp(-t/2))}
  var d='';for(var t=0;t<=10.001;t+=.1){d+=(t===0?'M':'L')+X(t).toFixed(1)+' '+Y(yv(t)).toFixed(1)+' '}
  root.innerHTML=baseSvg(lim,'A curve that levels off toward a limit of 8 '+lim.yu)+
    '<path class="curve" d="'+d+'"/><line class="tan" x1="'+X(0)+'" y1="'+Y(L)+'" x2="'+X(10)+'" y2="'+Y(L)+'"/>'+
    '<text class="annot" x="'+(X(10)-6)+'" y="'+(Y(L)-9)+'" text-anchor="end">limit = '+L+' '+lim.yu+'</text>'+
    '<path class="tri" id="lm-g"/><circle class="pt" id="lm-m" r="9" style="cursor:default"/></svg>'+
    '<div class="controls"><div><label for="lm-s">How far out in time: <span id="lm-tv"></span> '+lim.xu+'</label><input id="lm-s" type="range" min="0" max="10" step="0.1" value="1"></div></div>'+
    '<div class="readout" id="ro-limit" aria-live="polite"></div>';
  var s=$('#lm-s'),m=$('#lm-m'),g=$('#lm-g'),ro=$('#ro-limit'),tv=$('#lm-tv');

    g.setAttribute('d','M'+X(t)+' '+Y(0)+' L'+X(t)+' '+Y(y)+' L'+X(0)+' '+Y(y));
    tv.textContent=num(t,1);
    ro.innerHTML='<p class="eq">Value now: '+num(y,3)+' '+lim.yu+'</p><p class="eq">Gap from the limit: '+num(L-y,3)+' '+lim.yu+'</p><p class="sub">The curve never quite reaches '+L+', but it gets as close as you like. That settling value is the limit.</p>';
  }
  s.addEventListener('input',draw);draw();
}

function initOpt(){
  var root=$('#w-opt');if(!root)return;

  root.innerHTML=baseSvg({x:'width w ('+o.wu+')',y:'area ('+o.au+')'},'Area of a rectangle against its width, with the slope shown at one width',2.5)+
    '<path class="curve" d="'+d+'"/><g clip-path="url(#plot)"><line class="tan" id="op-t"/></g><path class="tri" id="op-g"/>'+
    '<circle class="pt" id="op-m" r="9" style="cursor:default"/></svg>'+
    '<div class="controls"><div><label for="op-s">Width w: <span id="op-wv"></span> '+o.wu+'</label><input id="op-s" type="range" min="0" max="10" step="0.1" value="1.5"></div></div>'+
    '<div class="readout" id="ro-opt" aria-live="polite"></div>';
  var s=$('#op-s'),mk=$('#op-m'),t=$('#op-t'),g=$('#op-g'),ro=$('#ro-opt'),wv=$('#op-wv');
  function draw(){
    var w=+s.value,A=w*(10-w),y=A/2.5,m=(10-2*w)/2.5,sl=10-2*w;
    mk.setAttribute('cx',X(w));mk.setAttribute('cy',Y(y));

    wv.textContent=num(w,1);
    var msg=Math.abs(sl)<.05?'The slope is zero. The area has leveled off at its highest point.':(sl>0?'The slope is positive: making the pen wider still adds area.':'The slope is negative: making the pen wider now loses area.');
    ro.innerHTML='<p class="eq">width = '+num(w,1)+' '+o.wu+', other side = '+num(10-w,1)+' '+o.wu+'</p><p class="eq">area = '+num(A,2)+' '+o.au+'</p><p class="eq">slope dA/dw = 10 − 2w = '+num(sl,1)+'</p><p class="sub">'+msg+'</p>';
  }

}

function initStrips(cfg){
  var root=$('#'+cfg.id);if(!root)return;
  var d1='',d2='';
  for(var t=0;t<=10.001;t+=.1){
    d1+=(t===0?'M':'L')+X(t).toFixed(1)+' '+Y(cfg.top(t)).toFixed(1)+' ';
    if(cfg.bot)d2+=(t===0?'M':'L')+X(t).toFixed(1)+' '+Y(cfg.bot(t)).toFixed(1)+' ';
  }
  root.innerHTML=baseSvg(cfg.axes,cfg.label)+'<path class="strip" id="st-p"/><path class="curve" d="'+d1+'"/>'+(cfg.bot?'<path class="curve" d="'+d2+'"/>':'')+'</svg>'+
    '<div class="controls"><div><label for="st-s">Number of '+cfg.what+': <span id="st-nv"></span></label><input id="st-s" type="range" min="1" max="40" step="1" value="'+cfg.nDef+'"></div></div>'+
    '<div class="readout" id="ro-st" aria-live="polite"></div>';
  var s=$('#st-s'),pth=$('#st-p'),nv=$('#st-nv'),ro=$('#ro-st');
  function draw(){
    var n=+s.value,w=10/n,sum=0,d='';
    for(var i=0;i<n;i++){
      var x0=i*w,xs=cfg.mode==='left'?x0:x0+w/2,tp=cfg.top(xs),bt=cfg.bot?cfg.bot(xs):0;
      sum+=(tp-bt)*w;
      d+='M'+X(x0).toFixed(1)+' '+Y(tp).toFixed(1)+' L'+X(x0+w).toFixed(1)+' '+Y(tp).toFixed(1)+' L'+X(x0+w).toFixed(1)+' '+Y(bt).toFixed(1)+' L'+X(x0).toFixed(1)+' '+Y(bt).toFixed(1)+' Z ';
    }
    pth.setAttribute('d',d);nv.textContent=n;
    ro.innerHTML='<p class="eq">'+n+' '+cfg.what+', each '+num(w,2)+' wide</p><p class="eq">sum of the '+cfg.what+' = '+num(sum,2)+' '+cfg.au+'</p><p class="eq">exact total = '+num(cfg.exact,2)+' '+cfg.au+', off by '+num(Math.abs(cfg.exact-sum),2)+'</p><p class="sub">'+cfg.sub+'</p>';
  }
  s.addEventListener('input',draw);draw();
}

  function draw(){
    var x=+s.value,y=f(x),a=f1(x),b=f2(x);
    mk.setAttribute('cx',X(x));mk.setAttribute('cy',Y(y));
    tl.setAttribute('x1',X(0));tl.setAttribute('y1',Y(y-a*x));tl.setAttribute('x2',X(10));tl.setAttribute('y2',Y(y+a*(10-x)));
    g.setAttribute('d','M'+X(x)+' '+Y(0)+' L'+X(x)+' '+Y(y));
    xv.textContent=num(x,1);
    var dir=Math.abs(a)<.08?'flat for an instant':(a>0?'rising':'falling');
    var bend=Math.abs(b)<.06?'the bend is flipping':(b>0?'bending up (a bowl shape)':'bending down (a hill shape)');
    var msg='';
    if(Math.abs(a)<.08)msg=b<0?'The slope is flat and the curve bends down, so this is a peak.':'The slope is flat and the curve bends up, so this is a valley.';
    else if(Math.abs(b)<.06)msg='The bend flips here from one side to the other. This is an inflection point, and the slope is not zero.';
    else msg='Slide toward where the slope line goes flat, then check which way the curve bends there.';
    ro.innerHTML='<p class="eq">slope f′ = '+num(a,2)+': '+dir+'</p><p class="eq">bend f″ = '+num(b,2)+': '+bend+'</p><p class="sub">'+msg+'</p>';
  }
  s.addEventListener('input',draw);draw();
}
function linShell(){return '<div class="wrap" id="w-lin"></div>'}
function initLin(){
  var root=$('#w-lin');if(!root)return;
  var c=CTX[state.track].lin,d='';
  function f(x){return .1*x*x}
  for(var t=0;t<=10.001;t+=.1){d+=(t===0?'M':'L')+X(t).toFixed(1)+' '+Y(f(t)).toFixed(1)+' '}
  root.innerHTML=baseSvg({x:c.x,y:c.y},'A curve, its tangent line at a point, and the gap between them one step away')+
    '<path class="curve" d="'+d+'"/><g clip-path="url(#plot)"><line class="tan" id="ln-t"/></g>'+
    '<line class="sec" id="ln-e"/><circle class="pfix" id="ln-p" r="8"/><circle class="pt" id="ln-q" r="8" style="cursor:default"/><circle class="hole" id="ln-h" r="6"/></svg>'+
    '<ul class="legend"><li>Filled dark dot: the known point</li><li>Yellow dot: the true value</li><li>Hollow dot: the tangent-line estimate</li></ul>'+
    '<div class="controls"><div><label for="ln-a">Known point a: <span id="ln-av"></span></label><input id="ln-a" type="range" min="2" max="8" step="0.5" value="4"></div>'+
    '<div><label for="ln-d">Step: <span id="ln-dv"></span></label><input id="ln-d" type="range" min="-2" max="2" step="0.1" value="0.5"></div></div>'+
    '<div class="readout" id="ro-lin" aria-live="polite"></div>';
  var sa=$('#ln-a'),sd=$('#ln-d'),tl=$('#ln-t'),er=$('#ln-e'),pp=$('#ln-p'),pq=$('#ln-q'),ph=$('#ln-h'),av=$('#ln-av'),dv=$('#ln-dv'),ro=$('#ro-lin');
  function draw(){
    var a=+sa.value,st=+sd.value,x=a+st,fa=f(a),m=.2*a,est=fa+m*st,act=f(x),err=act-est;
    tl.setAttribute('x1',X(0));tl.setAttribute('y1',Y(fa-m*a));tl.setAttribute('x2',X(10));tl.setAttribute('y2',Y(fa+m*(10-a)));
    pp.setAttribute('cx',X(a));pp.setAttribute('cy',Y(fa));
    pq.setAttribute('cx',X(x));pq.setAttribute('cy',Y(act));
    ph.setAttribute('cx',X(x));ph.setAttribute('cy',Y(est));
    er.setAttribute('x1',X(x));er.setAttribute('x2',X(x));er.setAttribute('y1',Y(est));er.setAttribute('y2',Y(act));
    av.textContent=num(a,1);dv.textContent=num(st,1);
    var ae=Math.abs(err),msg=Math.abs(st)<.05?'No step, no error: the tangent line touches the curve at the known point.':(ae<.05?'Tiny error. The tangent line is a good stand-in for a step this small.':'The error grows as the step gets bigger, because the curve bends away from its tangent.');
    ro.innerHTML='<p class="eq">known: f(a) = '+num(fa,2)+' '+c.yu+', slope f′(a) = '+num(m,2)+'</p><p class="eq">estimate = f(a) + f′(a) × step = '+num(est,3)+' '+c.yu+'</p><p class="eq">true value = '+num(act,3)+' '+c.yu+', error = '+num(ae,3)+'</p><p class="sub">'+msg+'</p>';
  }
  sa.addEventListener('input',draw);sd.addEventListener('input',draw);draw();
}
var VIS={
  slope:{shell:slopeShell,init:initSlope},
  secant:{shell:secantShell,init:initSecant},
  limit:{shell:limitShell,init:initLimit},
  rules:{shell:rulesShell,init:initRules},
  opt:{shell:optShell,init:initOpt},
  rel:{shell:relShell,init:initRel},
  mot:{shell:motShell,init:initMot},
  crv:{shell:crvShell,init:initCrv},
  lin:{shell:linShell,init:initLin},
  riem:{shell:riemShell,init:initRiem},
  ftc:{shell:ftcShell,init:initFtc},
  anti:{shell:antiShell,init:initAnti},
  btw:{shell:btwShell,init:initBtw},
  vol:{shell:volShell,init:initVol},
  tot:{shell:totShell,init:initTot},
  wrk:{shell:wrkShell,init:initWrk}
};

/* ---------- Render and events ---------- */
function renderChrome(){
  $$('.tracks .seg button').forEach(function(b){b.setAttribute('aria-checked',b.dataset.v===state.track?'true':'false')});
  var cur=ui.view==='parent'?'parent':(ui.view==='sync'?'sync':'home');
  ['home','parent','sync'].forEach(function(k){var el=$('#nav-'+k);if(!el)return;if(k===cur)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});
}
function render(toTop){
  cancelAnimationFrame(ui.raf);
  var app=$('#app');
  app.innerHTML=ui.view==='home'?homeView():(ui.view==='lesson'?lessonView():(ui.view==='sync'?syncView():parentView()));
  renderChrome();renderSyncNote();
  if(ui.view==='parent')startPoll();else stopPoll();
  if(ui.view==='lesson'&&ui.step===1){VIS[curLesson().visual].init()}
  if(toTop){window.scrollTo(0,0);if(!ui.focus)ui.focus='#app h1'}
  if(ui.focus){var el=$(ui.focus);if(el)el.focus();ui.focus=null}
}
function markStep(id,i){prog(id).steps[i]=true;save()}
function setStep(i){
  ui.step=i;if(i===3)ui.pq=newPQ();
  markStep(ui.lessonId,i);render(true);
}
function answer(s,i){
  var l=curLesson(),pq=ui.pq;
  if(!pq||pq.qi>=l.questions.length||pq.stage!==s)return;
  var q=l.questions[pq.qi],step=s===1?q.s1:q.s2;
  if(pq.wrong[s].indexOf(i)>=0)return;
  if(i===step.correct){
    if(s===1){pq.stage=2;ui.focus='fieldset.q[data-n="2"] .opt:not([disabled])'}
    else{
      pq.stage=3;
      var p=prog(l.id),prev=p.q[q.id]||{};
      p.q[q.id]={done:true,first:pq.first,tries:(prev.tries||0)+pq.tries,runs:(prev.runs||0)+1};
      pq.results.push(pq.first);save();
      ui.focus='[data-act="nextq"]';
    }
  }else{
    pq.wrong[s].push(i);pq.first=false;pq.tries++;
    ui.focus='fieldset.q[data-n="'+s+'"] .opt:not([disabled])';
  }
  render(false);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='track'){state.track=b.dataset.v;save();render(false)}
  else if(a==='home'){ui.view='home';ui.resetAsk=false;render(true)}
  else if(a==='parent'){ui.view='parent';ui.resetAsk=false;render(true)}
  else if(a==='sync'){ui.view='sync';ui.resetAsk=false;render(true)}
  else if(a==='sync-create'){doCreate()}
  else if(a==='sync-join'){doJoin()}
  else if(a==='sync-name'){doName()}
  else if(a==='sync-leave'){doLeave()}
  else if(a==='sync-copy'){doCopy(b)}
  else if(a==='sync-refresh'){refreshStudents()}
  else if(a==='open'){ui.lessonId=b.dataset.id;ui.view='lesson';ui.step=0;ui.pq=null;markStep(ui.lessonId,0);render(true)}
  else if(a==='step'){setStep(+b.dataset.i)}
  else if(a==='answer'){answer(+b.dataset.s,+b.dataset.i)}
  else if(a==='nextq'){var pq=ui.pq;pq.qi++;pq.stage=1;pq.wrong={1:[],2:[]};pq.first=true;pq.tries=0;ui.focus=pq.qi<curLesson().questions.length?'fieldset.q[data-n="1"] .opt':'.sum h3';render(false)}
  else if(a==='again'){ui.pq=newPQ();ui.focus='fieldset.q[data-n="1"] .opt';render(false)}
  else if(a==='reset-ask'){ui.resetAsk=true;render(false)}
  else if(a==='reset-no'){ui.resetAsk=false;render(false)}
  else if(a==='reset-yes'){state.progress={};store.set({track:state.track,progress:state.progress});push(true);ui.resetAsk=false;render(false)}
});
render(false);
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=e.target;
  if(t&&t.dataset&&t.dataset.enter){e.preventDefault();var b=$('[data-act="'+t.dataset.enter+'"]');if(b)b.click()}
});
startSync();
})();
</script>
