<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculus for Engineers</title>
<meta name="description" content="Learn why each calculus tool exists and when to use it, with examples for general, mechanical, and civil engineering.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📐%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  color-scheme:light;
  --paper:#EEF2EF;--surface:#FBFCFA;--ink:#14213D;--soft:#4B5A72;--line:#C7D2CC;
  --grid:rgba(20,33,61,.06);--cobalt:#2447D6;--on-cobalt:#FFFFFF;--mark:#F2D43D;--mark-ink:#14213D;
  --good:#1B7A45;--good-bg:#E1F3E8;--bad:#B3261E;--bad-bg:#FBE7E5;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1724;--surface:#162033;--ink:#E8EDF5;--soft:#9DABC0;--line:#2B3A53;
    --grid:rgba(170,195,235,.07);--cobalt:#8AA5FF;--on-cobalt:#0F1724;--mark:#F2D43D;--mark-ink:#14213D;
    --good:#66D492;--good-bg:#12301F;--bad:#FF9188;--bad-bg:#3A1816;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1724;--surface:#162033;--ink:#E8EDF5;--soft:#9DABC0;--line:#2B3A53;
  --grid:rgba(170,195,235,.07);--cobalt:#8AA5FF;--on-cobalt:#0F1724;--mark:#F2D43D;--mark-ink:#14213D;
  --good:#66D492;--good-bg:#12301F;--bad:#FF9188;--bad-bg:#3A1816;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font:400 1.0625rem/1.65 var(--body);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;letter-spacing:-.01em}
h1:focus{outline:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:.7rem 1.25rem;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem}
.brand{background:none;border:0;padding:0;margin-right:auto;font:700 1.15rem var(--display);letter-spacing:-.01em}
.nav{display:flex;gap:.25rem}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:.35rem .55rem;font:600 .95rem var(--display)}
.nav button[aria-current="page"]{border-bottom-color:var(--cobalt)}
.tracks{display:flex;align-items:center;gap:.35rem}
.tlabel{font:500 .9rem var(--display);color:var(--soft);margin-right:.2rem}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:.35rem .75rem;font:600 .9rem var(--display)}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--paper)}

main{max-width:1040px;margin:0 auto;padding:2.25rem 1.25rem 4.5rem}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.5rem);font-weight:700;letter-spacing:-.025em;max-width:19ch}
.lede{color:var(--soft);max-width:62ch;margin:1rem 0 0}
.cta{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:.6rem 1.05rem;border-radius:7px;font:600 1rem var(--display)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.btn.small{padding:.35rem .75rem;font-size:.9rem}
.btn:hover{border-color:var(--cobalt)}
.btn.primary:hover{filter:brightness(1.08)}

h2.sec-h{font-size:1.6rem;margin:3rem 0 1.25rem}
.rail{list-style:none;margin:0;padding:0}
.rail>li{position:relative;padding:0 0 2rem 3.6rem}
.rail>li::before{content:"";position:absolute;left:1.1rem;top:2.4rem;bottom:.2rem;border-left:2px solid var(--line)}
.rail>li:last-child::before{display:none}
.num{position:absolute;left:0;top:0;width:2.3rem;height:2.3rem;border:2px solid var(--ink);border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 1rem var(--display)}
.rail>li.soon .num{border-style:dashed;color:var(--soft);border-color:var(--soft)}
.rail h3{font-size:1.3rem;padding-top:.15rem}
.rail .blurb{margin:.2rem 0 .6rem;color:var(--soft)}
.soon-note{color:var(--soft);font-style:italic;margin:0}
.lessons{list-style:none;margin:0;padding:0}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem 1rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line)}
.lesson .lt2{font:600 1.05rem var(--display)}
.lesson .ls{display:block;color:var(--soft);font-size:.95rem;line-height:1.45}
.chip{display:inline-block;border:1.5px solid var(--soft);color:var(--soft);border-radius:999px;padding:.1rem .6rem;font:600 .8rem var(--display);white-space:nowrap}
.chip.done{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.chip.doing{border-color:var(--ink);background:var(--mark);color:var(--mark-ink)}

.back{background:none;border:0;padding:0;color:var(--cobalt);font:600 .95rem var(--display);margin-bottom:1rem;text-decoration:underline;text-underline-offset:3px}
.lt{font-size:clamp(1.8rem,4.4vw,2.7rem);font-weight:700;letter-spacing:-.02em}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem;margin:1.4rem 0 1.1rem;padding:0}
.steps button{border:1.5px solid var(--line);background:var(--surface);padding:.5rem .85rem;border-radius:7px;font:600 .95rem var(--display)}
.steps button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tick{color:var(--good);margin-left:.3rem}
.steps button[aria-current="step"] .tick{color:var(--mark)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:clamp(1rem,3vw,2rem)}
.panel h2{font-size:1.5rem;margin-bottom:.75rem}
.panel p{max-width:66ch}
.big-why{font-size:1.2rem;line-height:1.6}
.test{margin:1.5rem 0 0;padding:.9rem 1.1rem;border-left:6px solid var(--mark);background:var(--paper);max-width:66ch}
.test strong{font-family:var(--display)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem 2rem;margin-top:1rem}
.cols h3{font-size:1.05rem;margin-bottom:.4rem}
.cols ul{margin:0;padding-left:1.15rem}
.cols li{margin:.4rem 0}
.pager{display:flex;justify-content:space-between;gap:.75rem;margin-top:1.5rem}

.wrap{margin:.5rem 0 1rem}
.wrap svg{display:block;width:100%;height:auto;max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:6px;touch-action:pan-y}
.gl{stroke:var(--line);stroke-width:1}
.ax{stroke:var(--ink);stroke-width:1.5}
.tk{fill:var(--soft);font:12px var(--display)}
.al{fill:var(--ink);font:600 13px var(--display)}
.curve{fill:none;stroke:var(--ink);stroke-width:2.5}
.sec{stroke:var(--cobalt);stroke-width:3;fill:none}
.tan{stroke:var(--ink);stroke-width:2;stroke-dasharray:7 6;fill:none}
.tri{stroke:var(--soft);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.pt{fill:var(--mark);stroke:var(--ink);stroke-width:2;cursor:grab;touch-action:none}
.pt:active{cursor:grabbing}
.pfix{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.lab{fill:var(--ink);font:700 14px var(--display)}
.annot{fill:var(--soft);font:13px var(--display)}
.readout{font-family:var(--display);max-width:720px}
.readout .eq{font-size:1.2rem;font-weight:600;margin:.2rem 0}
.readout .sub{color:var(--soft);margin:.2rem 0}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem 1.5rem;max-width:720px;margin:.75rem 0}
.controls label{display:block;font:600 .95rem var(--display);margin-bottom:.2rem}
.controls input[type=range]{width:100%;accent-color:var(--cobalt)}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin:.6rem 0;padding:0;font:500 .9rem var(--display)}
.legend li{display:flex;align-items:center;gap:.5rem}
.legend svg{width:36px;height:10px;overflow:visible}
.caption{color:var(--soft);font-size:.95rem;max-width:66ch;margin:.5rem 0 0}

.qmeta{font:600 .9rem var(--display);color:var(--soft);margin:0 0 .4rem}
.prompt{font-size:1.2rem;margin:.2rem 0 1rem}
fieldset.q{border:0;padding:0;margin:1.25rem 0}
fieldset.q legend{font:600 1rem var(--display);padding:0;margin-bottom:.35rem}
.opt{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;margin:.5rem 0;padding:.8rem 1rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:7px;font:400 1.02rem/1.45 var(--body)}
.opt:hover:not([disabled]){border-color:var(--cobalt)}
.opt .tag{font:600 .85rem var(--display);white-space:nowrap}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .tag{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .tag{color:var(--bad)}
.opt[disabled]{cursor:default;color:var(--ink)}
.hint{font:500 .95rem var(--display);color:var(--bad);margin:.4rem 0 0}
.explain{margin-top:1.25rem;padding:1rem 1.1rem;border:1.5px solid var(--good);background:var(--good-bg);border-radius:7px}
.explain h3{font-size:1.05rem;margin-bottom:.3rem}
.explain p{margin:0}
.sum h2{font-size:1.6rem}

.tablewrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.98rem}
th,td{text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .9rem var(--display);color:var(--soft)}
.talk{max-width:66ch}
.talk li{margin:.6rem 0}
.fine{color:var(--soft);font-size:.95rem;max-width:66ch}
.danger{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line)}
.codebox{display:inline-block;margin:.4rem 0 .6rem;padding:.6rem 1rem;border:2px dashed var(--ink);border-radius:7px;background:var(--surface);font:700 clamp(1.3rem,5vw,1.9rem) var(--display);letter-spacing:.08em;user-select:all}
.field{display:block;margin:.7rem 0;font:600 .95rem var(--display)}
.field input{display:block;margin-top:.25rem;width:100%;max-width:22rem;padding:.55rem .7rem;border:1.5px solid var(--ink);border-radius:7px;background:var(--surface);color:var(--ink);font:400 1.05rem var(--body)}
code{font:500 .92em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);padding:.05em .35em;border-radius:4px}
.stu{margin-top:2.25rem}
.stu-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem 1rem}
.stu-h h2{font-size:1.5rem}
.stu-h .meta{color:var(--soft);font:500 .95rem var(--display)}
.strip{fill:var(--mark);fill-opacity:.55;stroke:var(--ink);stroke-width:1}
.solid{fill:var(--cobalt);fill-opacity:.14;stroke:none}
.ring{fill:var(--mark);stroke:var(--ink);stroke-width:1.5}
.disc{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.hole{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.mini{min-width:0;width:auto;font:500 .95rem var(--display);margin-top:.4rem}
.mini th,.mini td{padding:.3rem .8rem;text-align:right}
.mini th:first-child,.mini td:first-child{text-align:left;color:var(--soft)}
.picks{display:flex;flex-wrap:wrap;gap:.5rem;margin:.25rem 0 1.1rem}
.picks button{border:1.5px solid var(--line);background:var(--surface);padding:.45rem .8rem;border-radius:7px;font:600 .95rem var(--display)}
.picks button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fn{font:700 clamp(1.5rem,4vw,2.1rem) var(--display);margin:.2rem 0 .9rem}
.anat{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.6rem}
.piece{display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:6px;padding:.35rem .9rem .5rem;background:var(--surface);font:600 1.25rem var(--display)}
.plabel{font:500 .8rem var(--display);color:var(--soft)}
.op{font:600 1rem var(--display);padding-bottom:.65rem;color:var(--soft)}
.clue{margin:1rem 0 .6rem}
.rulebox{border-left:6px solid var(--cobalt);background:var(--paper);padding:.7rem 1.1rem;margin:.6rem 0;max-width:66ch}
.rulebox h3{font-size:1.1rem}
.rulebox p{margin:.3rem 0}
.formula{font:600 1.15rem var(--display)}
.shows{color:var(--soft);max-width:66ch}
.note{margin:1rem 0 0;padding:.6rem .9rem;border-left:5px solid var(--line);background:var(--surface);font:500 .95rem var(--display);max-width:66ch}

@media (max-width:640px){
  .lesson{grid-template-columns:1fr auto}
  .lesson .chip{grid-column:1;justify-self:start}
  .rail>li{padding-left:3.1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

    <button class="brand" data-act="home">Calculus for Engineers</button>

</header>

function ALL(t){return {general:t,mechanical:t,civil:t}}

 {short:'3x²',expr:'∫ 3x² dx, from 1 to 2',rule:'Power rule, backward',formula:'∫ xⁿ dx = xⁿ⁺¹ ÷ (n + 1)',

 {short:'x²',expr:'∫ x² dx, from 0 to 3',rule:'Power rule, backward',formula:'∫ xⁿ dx = xⁿ⁺¹ ÷ (n + 1)',

     explain:function(){return 'The outermost operation is adding and subtracting pieces. Take each piece on its own: the multiplier rides along, and a lone number disappears. f′(x) = 10x⁴ − 14x.'}},
    {id:'r6',topic:'Outermost operation first',
     talk:'Ask how they decide which rule goes first when more than one could apply.',
     prompt:{
       general:'A model multiplies x² by (x + 1)³: f(x) = x²(x + 1)³. Which rule do you start with?',
       mechanical:'A stress model multiplies x² by (x + 1)³: f(x) = x²(x + 1)³. Which rule do you start with?',
       civil:'A load model multiplies x² by (x + 1)³: f(x) = x²(x + 1)³. Which rule do you start with?'},
     s1:{label:'Step 1: Which rule first?',opts:RULE_OPTS,correct:2},
     s2:{label:'Step 2: Why?',opts:[
       'There is a power, so the power rule always comes first',
       'The outermost operation is multiplying x² by (x + 1)³',
       'Parentheses always mean the chain rule comes first'],correct:1},
     explain:function(){return 'Check the outermost operation first: x² is multiplied by (x + 1)³, so start with the product rule. Inside it, (x + 1)³ needs the chain rule to get v′ = 3(x + 1)². Rules often nest, and the outside one comes first.'}}
  ]
},
{
  id:'optimize',unit:4,title:'Optimization: finding the best',
  summary:'Use the slope to find the biggest, smallest, or best value.',
  why:{
    general:'Engineers are always asked for the best: the most area for the least fence, the lowest cost, the strongest shape. Testing every option wastes time. A derivative finds the best one directly, because at a peak or a valley the slope is zero for an instant.',
    mechanical:'Parts get designed for the least material, the lowest heat loss, the highest efficiency. Testing every size by hand doesn’t scale. At the best size the slope of the curve is zero, and the derivative finds exactly that spot.',
    civil:'Every project wants the most capacity for the least cost: the most lot area from a fixed length of fence, the cheapest cross-section that carries the load. At the best choice the slope of the area or cost curve is zero, so the derivative points straight to it.'
  },
  visual:'opt',
  caption:'A fixed perimeter of 20 wraps a rectangle. Slide the width and watch the area. The dashed line is the slope of the area curve at that width. Find where it goes flat.',
  use:[
    'The problem says “largest”, “smallest”, “best”, “least material”, or “lowest cost”.',
    'You have a fixed amount of something to spend, like fence, wire, or budget.',
    'You can write the quantity as a formula in one variable.'
  ],
  notuse:[
    'It gives two readings and wants the rate between them. That is an average rate.',
    'It links two changing rates through an equation. That is related rates, the next lesson.',
    'It asks how fast something changes at one exact moment, not for a best value. That is a plain derivative.'
  ],
  test:'Does the problem ask for the biggest or smallest value of something? Then set the derivative to zero, solve, and check what you found.',
  questions:[
    {id:'o1',topic:'Spotting an optimization problem',
     talk:'Ask which words in a problem say “find the best value”, like largest, smallest, or least.',
     prompt:{
       general:'You have 20 m of fence and want the rectangular pen with the largest area. What kind of problem is this?',
       mechanical:'You have 20 cm of wire and want the rectangular frame that encloses the most area. What kind of problem is this?',
       civil:'You have 20 m of fencing and want the rectangular lot with the most area. What kind of problem is this?'},
     s1:{label:'Step 1: Which kind?',opts:PTYPE,correct:0},
     s2:{label:'Step 2: Why?',opts:[
       'The wording asks for the largest value of something',
       'Two readings are given',
       'One rate is linked to another rate by an equation'],correct:0},
     explain:function(){return '“Largest” is the clue. The problem asks for the best value of a quantity, which is optimization: write the quantity as a formula, set its derivative to zero, and check that point.'}},
    {id:'o2',topic:'Zero slope at the best point',
     talk:'Ask why the slope has to be zero at the top of a peak.',
     prompt:{
       general:'A smooth curve of area against width has its highest point at one width. What is true about its slope there?',
       mechanical:'A smooth curve of heat loss against wall thickness has its lowest point at one thickness. What is true about its slope there?',
       civil:'A smooth curve of cost against beam depth has its lowest point at one depth. What is true about its slope there?'},
     s1:{label:'Step 1: What is the slope?',opts:['Zero','As steep as possible','Equal to 1'],correct:0},
     s2:{label:'Step 2: Why?',opts:[
       'Steepest means best',
       'At a peak or valley the curve levels off for an instant',
       'A turning point always has a slope of 1'],correct:1},
     explain:function(){return 'Going up toward a peak the slope is positive, and after the peak it is negative. In between it has to pass through zero. That is why setting the derivative to zero finds the best point.'}},
    {id:'o3',topic:'Solving for the best value',
     talk:'Ask them to explain each step: write the formula, differentiate, set it to zero, solve.',
     prompt:{
       general:'With 20 m of fence all the way around, the pen’s area is A(w) = w(10 − w), so dA/dw = 10 − 2w. Which width gives the largest area?',
       mechanical:'With 20 cm of wire all the way around, the frame’s area is A(w) = w(10 − w), so dA/dw = 10 − 2w. Which width gives the largest area?',
       civil:'With 20 m of fencing all the way around, the lot’s area is A(w) = w(10 − w), so dA/dw = 10 − 2w. Which width gives the largest area?'},
     s1:{label:'Step 1: Which width?',opts:function(c){return ['2.5 '+c.opt.wu,'5 '+c.opt.wu,'10 '+c.opt.wu]},correct:1},
     s2:{label:'Step 2: How do you get it?',opts:[
       'Pick the largest width allowed',
       'Set A(w) = 0 and solve',
       'Set dA/dw = 0 and solve: 10 − 2w = 0'],correct:2},
     explain:function(c){return 'Set the derivative to zero: 10 − 2w = 0, so w = 5 '+c.opt.wu+'. The other side is also 10 − 5 = 5, so the best rectangle is a square with area 25 '+c.opt.au+'.'}},
    {id:'o4',topic:'Two readings are not optimization',
     talk:'Ask why two readings and an average rate are a different kind of problem from finding a best value.',
     prompt:{
       general:'A pump’s pressure reads 20 kPa at t = 2 s and 50 kPa at t = 5 s. How fast did the pressure rise on average? What kind of problem is this?',
       mechanical:'A bearing’s temperature reads 20 °C at t = 2 s and 50 °C at t = 5 s. How fast did it heat up on average? What kind of problem is this?',
       civil:'A footing’s settlement reads 20 mm at 2 months and 50 mm at 5 months. How fast did it settle on average? What kind of problem is this?'},
     s1:{label:'Step 1: Which kind?',opts:PTYPE,correct:4},
     s2:{label:'Step 2: Why?',opts:[
       'The wording asks for the smallest value',
       'No best value is asked for, just the rate between two readings',
       'Two linked rates are involved'],correct:1},
     explain:function(){return 'Two readings mean an average rate: (50 − 20) ÷ (5 − 2) = 10 per unit of time. Nothing asks for a best value, so this isn’t optimization.'}}
  ]
},
{
  id:'related',unit:4,title:'Related rates: linked changes',
  summary:'When two changing quantities are tied by an equation, one rate gives you the other.',
  why:{
    general:'Sometimes you can’t measure the thing you care about directly, but you can measure something linked to it. An oil spill’s area is hard to measure, but its radius is easy. If the two are tied by an equation, a derivative turns the radius’s rate into the area’s rate.',
    mechanical:'A weld pool’s area matters for heat input, but what you can watch is how fast its radius spreads. The two are tied by an equation, and taking the derivative of that equation links their rates.',
    civil:'The wet area around a leak matters for repairs, but what you can measure is how fast its edge is spreading. The two are tied by an equation, and the derivative of that equation links their rates.'
  },
  visual:'rel',
  caption:'Slide the radius. The radius grows at a steady 0.5 per time unit, but the yellow ring, the new area added, gets bigger as the circle does.',
  use:[
    'Two or more quantities are changing with time.',
    'An equation ties them together, like A = πr² or V = (area) × (height).',
    'You know one rate and want another: “how fast is the area growing when the radius is…”.'
  ],
  notuse:[
    'Only one quantity is involved, and you want its rate at a point. That is a plain derivative.',
    'You want the best value, not a rate. That is optimization.',
    'You have two readings and want the average rate. No derivative needed.'
  ],
  test:'Do I know how fast one thing is changing, and want how fast another thing linked to it is changing? Then write the link, and differentiate with respect to time.',
  questions:[
    {id:'q1',topic:'Spotting a related rates problem',
     talk:'Ask what two quantities are changing, and what equation ties them together.',
     prompt:{
       general:'An oil spill’s radius grows at 2 m/min. How fast is its area growing when the radius is 10 m? What kind of problem is this?',
       mechanical:'A weld pool’s radius grows at 2 mm/s. How fast is its area growing when the radius is 10 mm? What kind of problem is this?',
       civil:'A wet patch’s radius grows at 2 m/h. How fast is its area growing when the radius is 10 m? What kind of problem is this?'},
     s1:{label:'Step 1: Which kind?',opts:PTYPE,correct:1},
     s2:{label:'Step 2: Why?',opts:[
       'The wording asks for the largest value',
       'Two readings are given',
       'Two changing quantities are tied by an equation, and one rate is given to find the other'],correct:2},
     explain:function(){return 'Radius and area both change with time and are tied by A = πr². One rate is given and the other is wanted. That is the signature of a related rates problem.'}},
    {id:'q2',topic:'Differentiating with respect to time',
     talk:'Ask why dr/dt shows up in the answer, and what the 2πr part represents.',
     prompt:{
       general:'Using A = πr², we get dA/dt = 2πr · dr/dt. What is dA/dt when r = 10 m and dr/dt = 2 m/min?',
       mechanical:'Using A = πr², we get dA/dt = 2πr · dr/dt. What is dA/dt when r = 10 mm and dr/dt = 2 mm/s?',
       civil:'Using A = πr², we get dA/dt = 2πr · dr/dt. What is dA/dt when r = 10 m and dr/dt = 2 m/h?'},
     s1:{label:'Step 1: What is dA/dt?',opts:function(c){var u=' '+c.rel.ru+'²/'+c.rel.tu;return ['62.8'+u,'125.7'+u,'314.2'+u]},correct:1},
     s2:{label:'Step 2: Why?',opts:[
       'Plug r = 10 into A = πr²',
       'Multiply dr/dt by π',
       'Use dA/dt = 2πr · dr/dt = 2π(10)(2)'],correct:2},
     explain:function(){return 'dA/dt = 2π(10)(2) ≈ 125.7. Plugging r into the area formula gives the area itself, 314.2, not how fast it grows. Dropping dr/dt gives 62.8, which ignores how fast the radius is moving.'}},
    {id:'q3',topic:'Why the same radius rate gives a different area rate',
     talk:'Ask why the area grows faster when the radius is bigger, even though the radius grows at the same pace.',
     prompt:{
       general:'The spill’s radius grows at a steady rate. When the radius is large, how fast is the area growing compared with when the radius is small?',
       mechanical:'The weld pool’s radius grows at a steady rate. When the radius is large, how fast is the area growing compared with when the radius is small?',
       civil:'The wet patch’s radius grows at a steady rate. When the radius is large, how fast is the area growing compared with when the radius is small?'},
     s1:{label:'Step 1: Faster, slower, or the same?',opts:['Slower','The same','Faster'],correct:2},
     s2:{label:'Step 2: Why?',opts:[
       'A longer edge adds more new area each moment, and dA/dt = 2πr · dr/dt grows with r',
       'The radius rate is steady, so everything is steady',
       'A bigger circle spreads its growth out'],correct:0},
     explain:function(){return 'Each moment the circle adds a thin ring around its edge. A bigger circle has a longer edge, so the same steady radius rate adds more area. That is why dA/dt = 2πr · dr/dt grows with r.'}},
    {id:'q4',topic:'One quantity is a plain derivative',
     talk:'Ask how they can tell there is only one changing quantity, so nothing needs linking.',
     prompt:{
       general:'A tank’s water level is h(t) = 0.2t² (meters, minutes). How fast is the level rising at exactly t = 4 min? What kind of problem is this?',
       mechanical:'A part’s temperature is T(t) = 0.2t² (°C, seconds). How fast is it heating up at exactly t = 4 s? What kind of problem is this?',
       civil:'A footing’s settlement is s(t) = 0.2t² (mm, months). How fast is it settling at exactly t = 4 months? What kind of problem is this?'},
     s1:{label:'Step 1: Which kind?',opts:PTYPE,correct:3},
     s2:{label:'Step 2: Why?',opts:[
       'Two rates are linked by an equation',
       'The wording asks for the best value',
       'Only one changing quantity is involved, so there is nothing to link'],correct:2},
     explain:function(){return 'Only one quantity is changing, and the question is about one exact moment. That is a plain derivative: the derivative of 0.2t² is 0.4t, which is 1.6 per unit of time at t = 4. No second quantity needs linking.'}}
  ]
},
{
  id:'motion',unit:4,title:'Motion: position, velocity, acceleration',
  summary:'Each one is the derivative of the one before it.',
  why:{
    general:'Anything that moves can be described three ways: where it is, how fast it is going, and how fast its speed is changing. Each one is the derivative of the one before it. Once you see that, one position formula tells you everything.',
    mechanical:'A piston’s position formula hides its speed and its acceleration, and acceleration is what sets the force on the rod. Each is the derivative of the one before, so one position formula gives you all three.',
    civil:'A braking train’s position formula hides its speed and its braking rate, and the braking rate sets the force on the track and on the passengers. Each is the derivative of the one before, so one position formula gives you all three.'
  },
  visual:'mot',
  caption:'Slide time. The dashed line is the slope of the position curve, which is the velocity. Watch the velocity fall to zero and then go negative.',
  use:[
    'The problem gives position and asks for velocity or acceleration.',
    'It says “speed”, “how fast is it moving”, “braking”, or “speeding up”.',
    'You have a position formula and want to know what is happening at one moment.'
  ],
  notuse:[
    'It gives two positions and two times and asks for the average velocity. No derivative needed.',
    'It asks for a best value, like the stopping point that minimizes something. That is optimization.',
    'It links two changing rates through an equation. That is related rates.'
  ],
  test:'Position to velocity is one derivative. Velocity to acceleration is one more. Count the steps.',
  questions:[
    {id:'v1',topic:'Spotting a motion problem',
     talk:'Ask how they can tell a problem is about position, velocity, or acceleration.',
     prompt:{
       general:'An elevator car’s position is given by a formula s(t). What is its velocity at exactly t = 3 s? What kind of problem is this?',
       mechanical:'A piston’s position is given by a formula s(t). What is its velocity at exactly t = 3 s? What kind of problem is this?',
       civil:'A train’s position is given by a formula s(t). What is its velocity at exactly t = 3 s? What kind of problem is this?'},
     s1:{label:'Step 1: Which kind?',opts:PTYPE,correct:2},
     s2:{label:'Step 2: Why?',opts:[
       'Position is given and velocity is wanted, so take one derivative',
       'Two rates are linked by an equation',
       'The wording asks for the best value'],correct:0},
     explain:function(){return 'Going from position to velocity is one derivative, so this is a motion problem. Velocity is the slope of the position curve at that moment.'}},
    {id:'v2',topic:'Position to velocity',
     talk:'Ask why plugging t = 3 into the position formula gives the wrong thing.',
     prompt:{
       general:'An elevator car’s position is s(t) = 4t² − t (meters, seconds). What is its velocity at t = 3 s?',
       mechanical:'A piston’s position is s(t) = 4t² − t (cm, seconds). What is its velocity at t = 3 s?',
       civil:'A train’s position is s(t) = 4t² − t (meters, seconds). What is its velocity at t = 3 s?'},
     s1:{label:'Step 1: What is the velocity?',opts:function(c){return ['33 '+c.mot.vu,'23 '+c.mot.vu,'8 '+c.mot.vu]},correct:1},
     s2:{label:'Step 2: How do you get it?',opts:[
       'Differentiate s to get v(t) = 8t − 1, then plug in t = 3',
       'Plug t = 3 into s(t)',
       'Take the second derivative'],correct:0},
     explain:function(c){return 'v(t) = s′(t) = 8t − 1, so v(3) = 23 '+c.mot.vu+'. Plugging 3 into s gives the position, 33 '+c.mot.pu+'. The 8 is the acceleration.'}},
    {id:'v3',topic:'Velocity to acceleration',
     talk:'Ask how acceleration relates to velocity, the way velocity relates to position.',
     prompt:{
       general:'Same elevator car, s(t) = 4t² − t. What is its acceleration?',
       mechanical:'Same piston, s(t) = 4t² − t. What is its acceleration?',
       civil:'Same train, s(t) = 4t² − t. What is its acceleration?'},
     s1:{label:'Step 1: What is the acceleration?',opts:function(c){return ['23 '+c.mot.au,'8 '+c.mot.au,'0 '+c.mot.au]},correct:1},
     s2:{label:'Step 2: Why?',opts:[
       'Acceleration is the velocity at t = 3',
       'Acceleration is position divided by time',
       'Acceleration is the derivative of velocity, so differentiate v(t) = 8t − 1 once more'],correct:2},
     explain:function(){return 'a(t) = v′(t) = 8, a constant. Acceleration is the derivative of velocity, which makes it the second derivative of position.'}},
    {id:'v4',topic:'Reading a negative velocity',
     talk:'Ask what a negative velocity means for the position, and what happens at the instant velocity is zero.',
     prompt:{
       general:'An elevator’s velocity is positive until t = 5 s, zero at 5 s, and negative afterward. What is it doing after 5 s?',
       mechanical:'A piston’s velocity is positive until t = 5 s, zero at 5 s, and negative afterward. What is it doing after 5 s?',
       civil:'A train’s velocity is positive until t = 5 s, zero at 5 s, and negative afterward. What is it doing after 5 s?'},
     s1:{label:'Step 1: What is it doing?',opts:['Speeding up forward','Stopped for good','Moving backward'],correct:2},
     s2:{label:'Step 2: Why?',opts:[
       'Negative velocity can’t happen',
       'Velocity is the rate of change of position, so a negative velocity means the position is decreasing',
       'Zero velocity means the position is zero'],correct:1},
     explain:function(){return 'Velocity is the slope of the position curve. A negative slope means the position is decreasing, so it is moving backward. At t = 5 the slope is zero for an instant: it has stopped to turn around.'}}
  ]
},
{
  id:'curve',unit:4,title:'Curve behavior: what the derivatives say',
  summary:'The first derivative says rising or falling. The second says bending up or down.',
  why:{
    general:'A graph tells its story in two layers. The first derivative says whether the curve is rising or falling. The second derivative says how that slope is changing, which means whether the curve is bending up or bending down. Together they let you read peaks, valleys, and bends without plotting a single point.',
    mechanical:'A beam’s deflection curve decides where it is most stressed. The first derivative gives the slope of the beam, and the second gives how sharply it bends, which is tied directly to stress. Reading both tells you where the beam peaks, where it bends the most, and where its bend flips.',
    civil:'A road’s elevation curve decides drainage, comfort, and safety. The first derivative gives the grade, climbing or descending. The second gives how the grade is changing, which is what makes a crest or a dip. Reading both tells you where the road peaks, dips, and changes its bend.'
  },
  visual:'crv',
  caption:'Slide along the curve. The dashed line is the slope, the first derivative. Find where it flattens, and watch the bend change from one side of the middle to the other.',
  use:[
    'The problem asks where something is rising, falling, at a peak, or at a valley.',
    'It asks whether a flat point is a maximum or a minimum.',
    'It says “concave”, “bending up or down”, or “inflection”.'
  ],
  notuse:[
    'It asks for the biggest or smallest value from a formula. Set that up as optimization, which uses this reading.',
    'It links one rate to another. That is related rates.',
    'It gives two readings only. That is an average rate, with no derivative needed.'
  ],
  test:'First derivative: rising or falling. Second derivative: bending up or bending down.',
  questions:[
    {id:'cu1',topic:'First derivative means rising or falling',
     talk:'Ask what the sign of the first derivative tells you about the curve.',
     prompt:T3('A temperature curve T(h) is given by a formula. Which tells you whether the temperature is rising or falling at a particular hour?','A beam’s deflection curve w(x) is given by a formula. Which tells you whether the deflection is increasing or decreasing at a particular spot?','A road’s elevation curve e(d) is given by a formula. Which tells you whether the road is climbing or descending at a particular spot?'),
     s1:{label:'Step 1: Which one?',opts:['The first derivative','The second derivative','The original function itself'],correct:0},
     s2:{label:'Step 2: Why?',opts:['The second derivative is the slope','The first derivative is the slope: positive means rising, negative means falling','The height of the function tells the direction'],correct:1},
     explain:function(){return 'The first derivative is the slope of the curve. Positive means rising, negative means falling, and zero means momentarily flat.'}},
    {id:'cu2',topic:'Flat points are the candidates for peaks and valleys',
     talk:'Ask why a peak has to be a place where the slope is zero.',
     prompt:T3('At which hours could the temperature curve have a daily high or low?','At which spots could the beam’s deflection curve have a maximum or minimum?','At which spots could the road’s elevation have a crest or a dip?'),
     s1:{label:'Step 1: Where?',opts:['Where the first derivative is zero','Where the second derivative is zero','Where the function itself equals zero'],correct:0},
     s2:{label:'Step 2: Why?',opts:['A crest is where the bend flips','At a crest or dip the slope levels off for an instant','The curve always crosses zero at a peak'],correct:1},
     explain:function(){return 'A smooth curve can only turn around where its slope passes through zero. Those flat points are the candidates for peaks and valleys. The second derivative then tells you which is which.'}},
    {id:'cu3',topic:'Second derivative tells peak from valley',
     talk:'Ask how the sign of the second derivative tells a hilltop from a valley bottom.',
     prompt:T3('The temperature curve is flat at 3 pm, and T″ = −2 there. What is happening at 3 pm?','The beam’s deflection curve is flat at midspan, and w″ = −2 there. What is happening at midspan?','The road’s elevation is flat at the 4 km mark, and e″ = −2 there. What is happening at 4 km?'),
     s1:{label:'Step 1: What is it?',opts:['A peak (a maximum)','A valley (a minimum)','An inflection point'],correct:0},
     s2:{label:'Step 2: Why?',opts:['A flat point is always a valley','A negative number always means the lowest point','A negative second derivative means the curve bends down, like a frown, so the flat point is the top'],correct:2},
     explain:function(){return 'f′ = 0 says the curve is flat. f″ < 0 says it bends downward there, like the top of a hill, so it is a peak. If f″ were positive it would be a valley.'}},
    {id:'cu4',topic:'A sign change in the second derivative flips the bend',
     talk:'Ask what an inflection point is, and whether the slope has to be zero there.',
     prompt:ALL('The second derivative changes from negative to positive at x = 5. What does that tell you about the curve at x = 5?'),
     s1:{label:'Step 1: What does it tell you?',opts:['There is a peak','The slope is zero','The bend flips from downward to upward (an inflection point)'],correct:2},
     s2:{label:'Step 2: Why?',opts:['A sign change always means a peak','The second derivative is the rate the slope is changing, so a sign change means the bend flips','The second derivative equals the slope'],correct:1},
     explain:function(){return 'f″ tells which way the curve bends. When it changes sign, the bend flips, and that point is an inflection point. The slope there isn’t necessarily zero.'}}
  ]
},
{
  id:'linear',unit:4,title:'Linear approximation: the tangent as a stand-in',
  summary:'Near a point you know, a curve looks like its tangent line, so you can estimate small changes quickly.',
  why:{
    general:'Plenty of formulas are painful to evaluate, and in the field you often just need a quick estimate for a small nudge. Zoom in far enough on any smooth curve and it looks like a straight line. That line, the tangent, is a cheap stand-in for the curve near a point you already know.',
    mechanical:'You know a part’s energy at one speed and how fast it changes there. A small nudge in speed doesn’t need the whole formula again. The tangent line gives a quick, reliable estimate near the point you already know.',
    civil:'You know the wind load at a design speed and how fast it changes there. When the speed shifts a little, you don’t need to redo the whole calculation. The tangent line gives a quick estimate near the point you know.'
  },
  visual:'lin',
  caption:'Move the point of tangency, then change the step. The vertical gap between the curve and the tangent line is the error. It stays tiny for small steps and grows quickly for big ones.',
  use:[
    'You know a value and the slope at one point, and the question asks about a small step away.',
    'The problem says “estimate”, “approximately”, or “small change”.',
    'The exact formula is awkward or unknown, but the slope is known.'
  ],
  notuse:[
    'The step is large. The tangent line drifts away from the curve.',
    'You need an exact value and the formula is easy to evaluate.',
    'You want the best value or a total. Use optimization or an integral.'
  ],
  test:'Start at the known value and add slope times the small step: f(a) + f′(a) × step.',
  questions:[
    {id:'li1',topic:'Spotting when to use the tangent line',
     talk:'Ask what clues say a problem wants a quick estimate from a known point and slope.',
     prompt:T3('The drag on a drone at 4 m/s is 1.6 N, and it is rising by 0.8 N per m/s there. You want a quick estimate of the drag at 4.5 m/s without redoing the whole formula. Which tool?','A part’s kinetic energy at 4 m/s is 1.6 J, and it is rising by 0.8 J per m/s there. You want a quick estimate at 4.5 m/s without redoing the formula. Which tool?','The wind load at 4 m/s is 1.6 kN, and it is rising by 0.8 kN per m/s there. You want a quick estimate at 4.5 m/s without redoing the calculation. Which tool?'),
     s1:{label:'Step 1: Which tool?',opts:LTYPE,correct:0},
     s2:{label:'Step 2: Why?',opts:['It asks for the best value','Two readings were given','It is a small step from a known point with a known slope, so the tangent line can stand in for the curve'],correct:2},
     explain:function(){return 'You know a value and the slope at one point, and the question is about a small step away. That is exactly what linear approximation is for.'}},
    {id:'li2',topic:'Using value plus slope times step',
     talk:'Ask them to explain each part of: known value plus slope times step.',
     prompt:T3('Same drone: drag is 1.6 N at 4 m/s, rising 0.8 N per m/s. What is the estimated drag at 4.5 m/s?','Same part: energy is 1.6 J at 4 m/s, rising 0.8 J per m/s. What is the estimated energy at 4.5 m/s?','Same structure: wind load is 1.6 kN at 4 m/s, rising 0.8 kN per m/s. What is the estimated load at 4.5 m/s?'),
     s1:{label:'Step 1: What is the estimate?',opts:function(c){return ['2.0 '+c.lin.yu,'2.4 '+c.lin.yu,'1.6 '+c.lin.yu]},correct:0},
     s2:{label:'Step 2: How do you get it?',opts:['Add the step to the known value','Start at the known value and add slope times the step: 1.6 + 0.8 × 0.5','Multiply the known value by the step'],correct:1},
     explain:function(){return 'Estimate = f(a) + f′(a) × step = 1.6 + 0.8 × 0.5 = 2.0. Forgetting to multiply the slope by the step (1.6 + 0.8) gives 2.4.'}},
    {id:'li3',topic:'Error grows with the step',
     talk:'Ask why a bigger step makes the tangent line a worse stand-in.',
     prompt:ALL('A step of 0.5 gave an error of 0.025. What happens to the error if the step grows to 2?'),
     s1:{label:'Step 1: What happens?',opts:['It shrinks','It grows quickly, since the curve bends away from its tangent','It stays the same'],correct:1},
     s2:{label:'Step 2: Why?',opts:['The tangent line gets more accurate with distance','Error doesn’t depend on the step','The farther from the known point, the more the curve bends away from the line'],correct:2},
     explain:function(){return 'The farther you step from the known point, the more the curve bends away from the tangent. Here a step of 2 gives 3.2 against a true 3.6, an error of 0.4, which is sixteen times bigger for a step four times bigger.'}},
    {id:'li4',topic:'Too high or too low',
     talk:'Ask which side of its tangent line a curve sits on when it bends upward.',
     prompt:ALL('The curve bends upward (its second derivative is positive). Is the tangent-line estimate too low or too high?'),
     s1:{label:'Step 1: Which one?',opts:['Too high','Exact','Too low'],correct:2},
     s2:{label:'Step 2: Why?',opts:['A curve that bends up sits above its tangent line, so the line underestimates','A curve that bends up sits below its tangent line','Tangent estimates are never off'],correct:0},
     explain:function(){return 'A curve bending upward lies above its tangent line, so the line gives an estimate that is slightly low. Check: the estimate 2.0 sits just under the true value 2.025.'}}
  ]
},
{
  id:'riemann',unit:5,title:'Adding up slices: the integral idea',
  summary:'How to add up a rate that keeps changing to get a total.',
  why:{
    general:'A derivative takes a total and tells you the rate. An integral goes the other way: it takes a rate that keeps changing and adds it all up. You can’t just multiply speed by time when the speed varies. But you can cut the trip into thin slices where the speed is nearly steady, then add the slices.',
    mechanical:'A motor’s power output isn’t constant, so the energy it used isn’t just power times time. Cut the time into thin slices where the power is nearly steady, multiply each slice, and add them up. As the slices get thinner the sum becomes exact, and that limit is the integral.',
    civil:'River flow into a reservoir keeps changing, so the volume that arrived isn’t just flow times time. Cut the time into thin slices where the flow is nearly steady, add them up, and let the slices shrink. That limit is the integral.'
  },
  visual:'riem',
  caption:'Slide the number of slices. Each yellow bar uses the rate at its left edge. Watch the sum close in on the exact total as the bars get thinner.',
  use:[
    'The problem gives a rate that changes and asks for a total.',
    'It says “total”, “accumulated”, “how much in all”, or “area under the curve”.',
    'Multiplying rate by time doesn’t work because the rate isn’t constant.'
  ],
  notuse:[
    'The rate is constant. Just multiply.',
    'You are given the total and want the rate. That is a derivative.',
    'You want the best value. That is optimization.'
  ],
  test:'Is something changing, and am I adding it up? Then slice, multiply each slice by its width, and add. That is an integral.',
  questions:[
    {id:'ri1',topic:'Spotting when to add up a changing rate',
     talk:'Ask why a changing rate can’t just be multiplied by time.',
     prompt:T3('A drone’s speed changes throughout its flight. You know the speed at every moment and want the total distance it flew. Which tool fits?','A motor’s power output changes through a shift. You know the power at every moment and want the total energy it used. Which tool fits?','Inflow to a reservoir changes through a storm. You know the inflow at every moment and want the total volume that arrived. Which tool fits?'),
     s1:{label:'Step 1: Which tool?',opts:ITYPE,correct:1},
     s2:{label:'Step 2: Why?',opts:['The rate keeps changing, so the total has to be added up in slices','The question asks how fast something is changing','Two readings are given and a rate is wanted'],correct:0},
     explain:function(){return 'A changing rate can’t just be multiplied by time. Cut the time into thin slices, multiply each slice’s rate by its width, and add them up. That sum, in the limit, is the integral.'}},
    {id:'ri2',topic:'Slice width matters',
     talk:'Ask why each slice’s rate has to be multiplied by the slice’s width.',
     prompt:T3('A drone’s speed is 2, 4, 6, and 8 m/min at the start of four half-minute slices. What is the left sum for the distance?','A motor’s power is 2, 4, 6, and 8 kW at the start of four half-hour slices. What is the left sum for the energy?','A reservoir’s inflow is 2, 4, 6, and 8 m³/h at the start of four half-hour slices. What is the left sum for the volume?'),
     s1:{label:'Step 1: What is the sum?',opts:function(c){return ['20 '+c.acc.au,'10 '+c.acc.au,'16 '+c.acc.au]},correct:1},
     s2:{label:'Step 2: How do you get it?',opts:['Add the rates and stop','Multiply each slice’s rate by its width (0.5), then add them all','Multiply the biggest rate by the total time'],correct:1},
     explain:function(){return '(2 + 4 + 6 + 8) × 0.5 = 10. Adding the rates alone forgets the slice width and gives 20, and using only the biggest rate overshoots at 8 × 2 = 16.'}},
    {id:'ri3',topic:'Thinner slices, better answer',
     talk:'Ask what happens to the leftover gaps as the slices get thinner.',
     prompt:ALL('A rate rises steadily, and you estimate the total with left-side slices. What happens to the estimate as you use thinner and thinner slices?'),
     s1:{label:'Step 1: What happens?',opts:['It gets closer to the exact total','It drifts further away','It stays exactly the same'],correct:0},
     s2:{label:'Step 2: Why?',opts:['Thinner slices add more error each time','Thinner slices hug the curve more closely, so the sum approaches the integral','The number of slices doesn’t matter'],correct:1},
     explain:function(){return 'Thin slices fit the curve better, so the leftover gaps shrink. As the slices shrink toward zero the sum settles onto one value, the exact total. That value is the integral.'}},
    {id:'ri4',topic:'A steady rate needs no integral',
     talk:'Ask how they can tell when a rate is steady enough to just multiply.',
     prompt:T3('A drone flies at a steady 12 m/min for 5 min. How far does it go?','A motor draws a steady 6 kW for 5 h. How much energy does it use?','A pump moves a steady 8 m³/h for 5 h. How much volume does it move?'),
     s1:{label:'Step 1: Which tool?',opts:ITYPE,correct:2},
     s2:{label:'Step 2: Why?',opts:['The rate never changes, so one multiplication gives the total','Anything with a total needs an integral','A steady rate means a derivative'],correct:0},
     explain:function(){return 'A steady rate times the time gives the total with no slicing. Save integrals for rates that change.'}}
  ]
},
{
  id:'ftc',unit:5,title:'Integrals and derivatives undo each other',
  summary:'The running total of a rate grows at exactly that rate.',
  why:{
    general:'Here is the surprise at the heart of calculus. Add up a rate to get a running total, and the rate of change of that total is the rate you started with. Derivative and integral are opposites, like multiplying and dividing. That is why you can find exact totals without slicing at all.',
    mechanical:'Energy used so far is the running total of power. Ask how fast that running total is growing, and you get the power back. Derivative and integral undo each other, which is what lets you find exact totals without cutting anything into slices.',
    civil:'Water stored so far is the running total of inflow. Ask how fast that total is growing, and you get the inflow back. Derivative and integral undo each other, so you can find exact totals without slicing.'
  },
  visual:'ftc',
  caption:'Slide along the rate curve. The top graph shades the total so far. The bottom graph plots that running total, and its dashed slope line matches the rate above.',
  use:[
    'One quantity is the running total of another.',
    'You have a formula for the rate and want an exact total.',
    'You have a formula for the total and want the rate.'
  ],
  notuse:[
    'You only have a few readings, not a formula. Add up slices instead.',
    'The question asks for the best value. That is optimization.',
    'Nothing is changing. Just multiply.'
  ],
  test:'Which way am I going? From a total to its rate is a derivative. From a rate to its total is an integral.',
  questions:[
    {id:'f1',topic:'Total to rate is a derivative',
     talk:'Ask which direction goes from a total to its rate, and which goes the other way.',
     prompt:T3('A drone’s distance flown so far, D(t), is known as a formula. You want its speed at one moment. Which tool?','A motor’s energy used so far, E(t), is known as a formula. You want its power at one moment. Which tool?','A reservoir’s stored volume, V(t), is known as a formula. You want the inflow at one moment. Which tool?'),
     s1:{label:'Step 1: Which tool?',opts:ITYPE,correct:0},
     s2:{label:'Step 2: Why?',opts:['Going from a total to its rate is an integral','Going from a total to its rate is a derivative','The rate is constant, so just multiply'],correct:1},
     explain:function(){return 'The running total is given and the rate is wanted. A derivative takes a total and returns how fast it is growing.'}},
    {id:'f2',topic:'Rate to total is an integral',
     talk:'Ask how they can tell a problem needs a total built from a rate.',
     prompt:T3('A drone’s speed v(t) is known as a formula. You want the total distance flown over the trip. Which tool?','A motor’s power P(t) is known as a formula. You want the total energy used over a shift. Which tool?','A reservoir’s inflow q(t) is known as a formula. You want the total volume that arrived over a storm. Which tool?'),
     s1:{label:'Step 1: Which tool?',opts:ITYPE,correct:1},
     s2:{label:'Step 2: Why?',opts:['Going from a rate to its total is a derivative','Two readings were given','Going from a rate to its total is an integral'],correct:2},
     explain:function(){return 'The rate is given and the running total is wanted. An integral takes a rate and returns the total it adds up to.'}},
    {id:'f3',topic:'Slope of a running total',
     talk:'Ask why the running total grows exactly as fast as the rate being added.',
     prompt:ALL('A running total A(x) adds up a rate f over time. What is the slope of A at any moment?'),
     s1:{label:'Step 1: What is the slope?',opts:['Zero','f(x), the rate being added at that moment','A(x) itself'],correct:1},
     s2:{label:'Step 2: Why?',opts:['A running total always has a flat slope','The slope is the area so far','The total grows exactly as fast as the rate being added'],correct:2},
     explain:function(){return 'The total grows at exactly the rate being added at that moment. That is the first half of the Fundamental Theorem: the derivative of the running total is the rate.'}},
    {id:'f4',topic:'Using the undoing to find a total',
     talk:'Ask how finding a function whose derivative is the rate gives the total without slicing.',
     prompt:ALL('A function F has derivative F′(x) = 2x. What is the total, the integral of 2x from 0 to 3?'),
     s1:{label:'Step 1: What is the total?',opts:['3','9','6'],correct:1},
     s2:{label:'Step 2: How do you get it?',opts:['Plug 3 into 2x','Multiply 2x by 3','Find a function whose derivative is 2x, which is x², then subtract its values at the ends: 9 − 0'],correct:2},
     explain:function(){return 'F(x) = x² has derivative 2x, so the total is F(3) − F(0) = 9 − 0 = 9. Plugging 3 into the rate gives 6, which is the rate at the end, not the total.'}}
  ]
},
{
  id:'antider',unit:5,title:'Finding exact totals: antiderivatives',
  summary:'Run the derivative rules backward, then subtract the values at the two ends.',
  why:{
    general:'Slicing and adding is the idea, but nobody does it by hand. The shortcut: find a function whose derivative is your rate, then subtract its values at the two ends. That function is an antiderivative, and the rules you already know run in reverse.',
    mechanical:'To get the exact energy a motor used, you don’t slice the shift into thousands of pieces. You find a function whose derivative is the power, then subtract its values at the start and the end. The derivative rules run in reverse to find it.',
    civil:'To get the exact volume that arrived in a storm, you don’t slice it into thousands of pieces. You find a function whose derivative is the inflow, then subtract its values at the start and the end. The derivative rules run in reverse to find it.'
  },
  visual:'anti',
  caption:'Pick a rate. See which rule runs backward, how to check the answer by differentiating, and how to evaluate the total.',
  use:[
    'The problem wants an exact total and gives a formula for the rate.',
    'The rate is a power of x or a sum of them: run the power rule backward.',
    'A function and the derivative of its inside sit side by side, like 2x(x² + 1)³: run the chain rule backward.'
  ],
  notuse:[
    'You only have readings, not a formula. Add up slices instead.',
    'You want a rate from a total. That is a derivative.',
    'Nothing is changing. Just multiply.'
  ],
  test:'Can I think of a function whose derivative is my rate? Then evaluate it at the two ends and subtract.',
  questions:[
    {id:'a1',topic:'Undoing a derivative',
     talk:'Ask them to check an antiderivative by differentiating it.',
     prompt:ALL('Which function has derivative 3x²?'),
     s1:{label:'Step 1: Which function?',opts:['x³','3x³','x²'],correct:0},
     s2:{label:'Step 2: Why?',opts:['The power should stay the same, and only the 3 changes','Anything with a 3 in it works','Differentiating x³ gives 3x², so x³ undoes it'],correct:2},
     explain:function(){return 'Run the power rule backward: add 1 to the power and divide by the new power. x² becomes x³ ÷ 3, so 3x² becomes x³. Check by differentiating x³ and you get 3x².'}},
    {id:'a2',topic:'Evaluating at the two ends',
     talk:'Ask why we subtract the value at the start from the value at the end.',
     prompt:ALL('A rate is x². What is the total, the integral of x² from 0 to 3?'),
     s1:{label:'Step 1: What is the total?',opts:['27','9','3'],correct:1},
     s2:{label:'Step 2: How do you get it?',opts:['The antiderivative is x³ ÷ 3, so the total is 27 ÷ 3 − 0','Plug 3 into x²','The antiderivative is x³, so the total is 27'],correct:0},
     explain:function(){return 'The antiderivative of x² is x³ ÷ 3. Evaluate at 3 and at 0 and subtract: 27 ÷ 3 − 0 = 9. Forgetting to divide by 3 gives 27.'}},
    {id:'a3',topic:'A total from a rate formula',
     talk:'Ask the difference between the rate at the end and the total over the whole time.',
     prompt:T3('A drone’s speed is 4t + 1 m/min. How far does it fly in the first 3 minutes?','A motor’s power is 4t + 1 kW. How much energy does it use in the first 3 hours?','A reservoir’s inflow is 4t + 1 m³/h. How much volume arrives in the first 3 hours?'),
     s1:{label:'Step 1: What is the total?',opts:function(c){return ['13 '+c.acc.au,'21 '+c.acc.au,'39 '+c.acc.au]},correct:1},
     s2:{label:'Step 2: How do you get it?',opts:['Plug t = 3 into the rate','Multiply the rate at t = 3 by 3','The antiderivative is 2t² + t, so evaluate at 3 and 0 and subtract'],correct:2},
     explain:function(){return 'The antiderivative of 4t + 1 is 2t² + t. At 3 it is 18 + 3 = 21, and at 0 it is 0, so the total is 21. Plugging in 3 gives the rate at the end (13), and multiplying that by 3 gives 39, which assumes the rate was always that high.'}},
    {id:'a4',topic:'The chain rule run backward',
     talk:'Ask what clue shows that the chain rule is hiding inside an integral.',
     prompt:ALL('Which function is an antiderivative of 2x(x² + 1)³?'),
     s1:{label:'Step 1: Which function?',opts:['(x² + 1)⁴ ÷ 4','(x² + 1)⁴','2x(x² + 1)⁴ ÷ 4'],correct:0},
     s2:{label:'Step 2: Why?',opts:['Just raise everything to the 4th power','Run the chain rule backward: the derivative of (x² + 1)⁴ ÷ 4 is (x² + 1)³ · 2x','Divide only the 2x by 4'],correct:1},
     explain:function(){return 'The inside, x² + 1, has derivative 2x, and 2x is sitting right there. That signals the chain rule run backward. Differentiating (x² + 1)⁴ ÷ 4 gives (x² + 1)³ · 2x, exactly the rate.'}}
  ]
},
{
  id:'between',unit:6,title:'Area between curves',
  summary:'Slice a region into strips as tall as top minus bottom.',
  why:{
    general:'Real shapes are rarely bounded by one curve and the axis. A land parcel, a cut-out plate, a channel: each sits between two boundaries. Slice it into thin strips, each as tall as the gap between the boundaries, and add the strips up.',
    mechanical:'A plate cut between two profile curves has an area you need for weight and material cost. Slice it into thin strips, each as tall as the gap between the curves, and add them up.',
    civil:'A channel’s cross-section sits between the bank on one side and the bed on the other, and its area sets how much water it can carry. Slice it into thin strips, each as tall as the gap, and add them up.'
  },
  visual:'btw',
  caption:'Slide the number of strips. Each strip is as tall as top minus bottom, so the strips add up to the area between the curves.',
  use:[
    'The problem says “region between”, “enclosed by”, or “between the curves”.',
    'Two boundary curves are given.',
    'You can slice the region into thin strips of height top − bottom.'
  ],
  notuse:[
    'Only one curve and the axis are involved. That is plain area under a curve.',
    'A volume is wanted, not an area. That is slicing into solids.',
    'The problem gives a rate and wants a total. No region is involved.'
  ],
  test:'Slice into thin strips. Each strip’s height is top minus bottom. Add them up.',
  questions:[
    {id:'b1',topic:'Spotting an area-between problem',
     talk:'Ask what words in a problem point to a region bounded by two curves.',
     prompt:T3('A land parcel lies between two boundary curves. You need its area. What kind of problem is this?','A plate is cut between two profile curves. You need its area. What kind of problem is this?','A channel’s banks follow two curves. You need the cross-section area between them. What kind of problem is this?'),
     s1:{label:'Step 1: Which kind?',opts:U6,correct:0},
     s2:{label:'Step 2: Why?',opts:['A rate is given and a total is wanted','A force changes with distance','The region is bounded by two curves, so slice it into strips of top minus bottom'],correct:2},
     explain:function(){return 'A region between two boundary curves is an area-between problem. Slice it into thin vertical strips, each as tall as top minus bottom, and add them up.'}},
    {id:'b2',topic:'Setting up top minus bottom',
     talk:'Ask them to explain which curve is on top and why that decides the subtraction.',
     prompt:ALL('The top boundary is y = x and the bottom is y = 0.1x², from x = 0 to x = 10. Which integral gives the area?'),
     s1:{label:'Step 1: Which integral?',opts:['∫ (x − 0.1x²) dx','∫ (x + 0.1x²) dx','∫ (0.1x² − x) dx'],correct:0},
     s2:{label:'Step 2: Why?',opts:['Add the two curves to combine them','Each strip’s height is the top curve minus the bottom curve','The order of subtraction never matters'],correct:1},
     explain:function(){return 'A strip stretches from the bottom curve up to the top curve, so its height is top minus bottom: x − 0.1x². Adding the curves would measure something else entirely.'}},
    {id:'b3',topic:'Evaluating the area',
     talk:'Ask why integrating only the top curve gives too much area.',
     prompt:ALL('Evaluate the area: the integral of (x − 0.1x²) from 0 to 10.'),
     s1:{label:'Step 1: What is the area?',opts:function(c){return ['16.7 '+c.btw.au,'83.3 '+c.btw.au,'50 '+c.btw.au]},correct:0},
     s2:{label:'Step 2: How do you get it?',opts:['Add the area under each curve','Only integrate the top curve','The antiderivative is x² ÷ 2 − x³ ÷ 30, which is 50 − 33.3 at 10 and 0 at 0'],correct:2},
     explain:function(){return 'The antiderivative of x − 0.1x² is x² ÷ 2 − x³ ÷ 30. At 10 that is 50 − 33.3 = 16.7, and at 0 it is 0. Adding the two areas (83.3) or using only the top curve (50) answers a different question.'}},
    {id:'b4',topic:'Why top minus bottom',
     talk:'Ask what a negative area would tell you about the setup.',
     prompt:ALL('Why do we subtract top minus bottom instead of bottom minus top?'),
     s1:{label:'Step 1: Which is right?',opts:['Bottom minus top is just as good','Top minus bottom keeps each strip’s height positive','You should add them instead'],correct:1},
     s2:{label:'Step 2: Why?',opts:['The order of subtraction never matters in calculus','The top curve is always the bigger number','A strip’s height is a distance, so it must be positive. The other order gives a negative area'],correct:2},
     explain:function(){return 'Each strip’s height is the distance between the curves, which has to be positive. Swapping the order flips the sign and gives a negative area. If you ever get one, check which curve is on top.'}}
  ]
},
{
  id:'volume',unit:6,title:'Volume of a solid by slicing',
  summary:'Slice a solid into thin disks, find each disk’s area, and add them up.',
  why:{
    general:'Tanks, funnels, and shafts are shaped by spinning a curve around an axis. You can’t multiply length by one area because the area changes along the way. Slice the solid into thin disks, find each disk’s area, and add them up.',
    mechanical:'A turned shaft changes width along its length, so its volume, and so its mass, isn’t one area times the length. Slice it into thin disks, find each disk’s area, and add them up.',
    civil:'A funnel-shaped tank gets wider along its height, so its capacity isn’t one area times the height. Slice it into thin disks, find each disk’s area, and add them up.'
  },
  visual:'vol',
  caption:'Slide along the axis. The yellow disk is one thin slice of the solid, and its area is π times the radius squared. Adding up every disk gives the volume.',
  use:[
    'The problem says “rotated around”, “solid of revolution”, or gives cross-sections.',
    'Each slice has an area you can write as a formula, like π r² for a disk.',
    'You want how much space the solid takes up.'
  ],
  notuse:[
    'A flat area is wanted. That is area under or between curves.',
    'A total from a rate is wanted. No solid is involved.',
    'Every cross-section is the same size. Just multiply base area by length.'
  ],
  test:'Slice it. Find the area of one slice. Multiply by its thickness and add them up.',
  questions:[
    {id:'vo1',topic:'Spotting a volume problem',
     talk:'Ask what “rotated around” tells you about the shape of each slice.',
     prompt:T3('A tank is made by spinning the curve y = 0.1x² around the x-axis, from x = 0 to x = 10 m. You need its volume. What kind of problem is this?','A shaft is turned by spinning the curve y = 0.1x² around the x-axis, from x = 0 to x = 10 cm. You need its volume. What kind of problem is this?','A funnel-shaped tank is made by spinning the curve y = 0.1x² around the x-axis, from x = 0 to x = 10 m. You need its volume. What kind of problem is this?'),
     s1:{label:'Step 1: Which kind?',opts:U6,correct:1},
     s2:{label:'Step 2: Why?',opts:['Two flat curves bound a region','A force changes with distance','The solid is built from slices whose areas can be added up'],correct:2},
     explain:function(){return 'Spinning a curve around an axis makes a solid. Its volume comes from slicing it into thin disks and adding up their volumes.'}},
    {id:'vo2',topic:'The area of one disk',
     talk:'Ask what the radius of each disk is, and where it comes from on the graph.',
     prompt:ALL('Each slice of that solid is a thin disk. What is the area of one disk at position x?'),
     s1:{label:'Step 1: What is the area?',opts:['0.1x²','π(0.1x²)²','2π(0.1x²)'],correct:1},
     s2:{label:'Step 2: Why?',opts:['The area of a disk is just its radius','The disk’s radius is the height of the curve, and its area is π times the radius squared','The area of a disk is its circumference'],correct:1},
     explain:function(){return 'The disk’s radius is the height of the curve, 0.1x². A disk’s area is π times the radius squared, so it is π(0.1x²)². The radius alone, or 2π times it, measures a length instead of an area.'}},
    {id:'vo3',topic:'Setting up the volume integral',
     talk:'Ask why the π can’t be left out of the integral.',
     prompt:ALL('Which integral adds up the disks to give the volume?'),
     s1:{label:'Step 1: Which integral?',opts:['∫ from 0 to 10 of π(0.1x²)² dx','∫ from 0 to 10 of π(0.1x²) dx','∫ from 0 to 10 of (0.1x²)² dx'],correct:0},
     s2:{label:'Step 2: Why?',opts:['Add up the radii','Skip the π, since it is a constant','Add up the disk areas π r² across the length, using r = 0.1x²'],correct:2},
     explain:function(){return 'Volume is the sum of disk areas times their thickness. Each disk has area π r² with r = 0.1x², and thickness dx. The π can’t be dropped.'}},
    {id:'vo4',topic:'Evaluating a volume',
     talk:'Ask why the answer has a π in it.',
     prompt:ALL('Evaluate it: π times the integral of 0.01x⁴ from 0 to 10.'),
     s1:{label:'Step 1: What is the volume?',opts:function(c){return ['62.8 '+c.vol.vu,'628.3 '+c.vol.vu,'200 '+c.vol.vu]},correct:1},
     s2:{label:'Step 2: How do you get it?',opts:['The antiderivative is 0.002x⁵. At 10 that is 200, then multiply by π','Skip the π','Plug in x = 10 without integrating'],correct:0},
     explain:function(){return 'The antiderivative of 0.01x⁴ is 0.002x⁵. At 10 that is 200, and at 0 it is 0, so V = 200π ≈ 628.3. Dropping the π gives 200.'}}
  ]
},
{
  id:'total',unit:6,title:'Total change and average value',
  summary:'The integral gives the total, and dividing by the time gives the steady rate that matches it.',
  why:{
    general:'You often need two numbers from a changing rate: the total that piled up, and the single steady rate that would have given the same total. The first is the integral. The second is the average value, the integral divided by the time.',
    mechanical:'From a motor’s changing power you need two numbers: the total energy used, and the single steady power that would have used the same energy. The first is the integral. The second is the average value, the integral divided by the time.',
    civil:'From a storm’s changing inflow you need two numbers: the total volume that arrived, and the single steady inflow that would have delivered the same volume. The first is the integral. The second is the average value, the integral divided by the time.'

var store={
  get:function(){try{var r=localStorage.getItem('cfe-v1');return r?JSON.parse(r):null}catch(e){return null}},
  set:function(v){try{localStorage.setItem('cfe-v1',JSON.stringify(v))}catch(e){}}
};
var saved=store.get()||{};
var state={
  track:CTX[saved.track]?saved.track:'general',
  progress:(saved.progress&&typeof saved.progress==='object')?saved.progress:{}
};
var ui={view:'home',lessonId:null,step:0,pq:null,resetAsk:false,raf:0,focus:null};
function save(){store.set({track:state.track,progress:state.progress});scheduleSync()}
function prog(id){if(!state.progress[id])state.progress[id]={steps:{},q:{}};if(!state.progress[id].steps)state.progress[id].steps={};if(!state.progress[id].q)state.progress[id].q={};return state.progress[id]}
function lessonStatus(l,P){
  var p=(P||state.progress)[l.id];if(!p)return 'new';
  var all=l.questions.every(function(q){return p.q&&p.q[q.id]&&p.q[q.id].done});
  if(all)return 'done';
  var any=Object.keys(p.steps||{}).length||Object.keys(p.q||{}).length;
  return any?'doing':'new';
}
var STATUS_LABEL={new:'Not started',doing:'In progress',done:'Finished'};
function nextLesson(){
  for(var i=0;i<LESSONS.length;i++)if(lessonStatus(LESSONS[i])!=='done')return {l:LESSONS[i],all:false};
  return {l:LESSONS[0],all:true};
}
function curLesson(){return lessonById(ui.lessonId)}
function newPQ(){return {qi:0,stage:1,wrong:{1:[],2:[]},first:true,tries:0,results:[]}}
function num(n,d){
  d=(d===undefined)?1:d;var f=Math.pow(10,d);
  var v=Math.round(n*f)/f;if(v===0)v=0;
  return v.toFixed(d).replace('-','−');
}

/* ---------- Family sync (optional Cloudflare Worker) ---------- */
var CFG=window.CFE_CONFIG||{};
var API=String(CFG.apiBase||'').replace(/\/+$/,'');
var SYNC_KEY='cfe-sync-v1';
function randomId(){
  var a=new Uint8Array(10),out='';
  if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(a)}else{for(var i=0;i<10;i++)a[i]=Math.floor(Math.random()*256)}
  for(var j=0;j<a.length;j++)out+=('0'+a[j].toString(16)).slice(-2);
  return out;
}
var syncCfg=(function(){try{var r=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');return(r&&typeof r==='object')?r:{}}catch(e){return {}}})();
if(!/^[a-z0-9]{8,32}$/.test(String(syncCfg.sid||'')))syncCfg.sid=randomId();
function saveCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify({code:syncCfg.code||'',name:syncCfg.name||'',sid:syncCfg.sid}))}catch(e){}}
saveCfg();
var sync={status:'idle',students:[],loaded:false,timer:0,busy:false,again:false,poll:0,msg:''};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function mergeProgress(a,b){
  var out={};a=a||{};b=b||{};
  Object.keys(a).concat(Object.keys(b)).forEach(function(id){
    if(out[id])return;
    var pa=a[id]||{},pb=b[id]||{};
    var steps=Object.assign({},pb.steps||{},pa.steps||{}),q={};
    var qa=pa.q||{},qb=pb.q||{};
    Object.keys(qa).concat(Object.keys(qb)).forEach(function(k){
      if(q[k])return;
      var x=qa[k],y=qb[k];
      q[k]=!x?y:(!y?x:((y.runs||0)>(x.runs||0)?y:x));
    });
    out[id]={steps:steps,q:q};
  });
  return out;
}
function sameName(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
var SYNC_NOTE={
  off:'Saved on this device only.',
  unlinked:'Saved on this device only. Use Family sync to share progress with a parent.',
  viewer:'Linked to your family code. This device shows progress but doesn’t share its own.',
  idle:'Linked to your family code.',
  syncing:'Saving to your family code…',
  synced:'Progress is saved to your family code.',
  error:'Couldn’t reach the sync service. Progress is still saved on this device.'
};
function syncNoteKey(){
  if(!API)return 'off';
  if(!syncCfg.code)return 'unlinked';
  if(!syncCfg.name)return 'viewer';
  return sync.status;
}
function renderSyncNote(){var el=$('#sync-note');if(el)el.textContent=SYNC_NOTE[syncNoteKey()]||SYNC_NOTE.off}
function canShare(){return !!(API&&syncCfg.code&&syncCfg.name)}
async function api(method,path,body){
  var res=await fetch(API+path,{method:method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  var data={};
  try{data=await res.json()}catch(e){}
  if(!res.ok){var err=new Error(data.error||('Request failed ('+res.status+')'));err.status=res.status;throw err}
  return data;
}
function scheduleSync(){
  if(!canShare())return;
  clearTimeout(sync.timer);
  sync.timer=setTimeout(function(){push()},900);
}
async function push(){
  if(!canShare())return;
  if(sync.busy){sync.again=true;return}
  sync.busy=true;sync.status='syncing';renderSyncNote();
  try{
    await api('PUT','/api/family/'+encodeURIComponent(syncCfg.code)+'/student/'+syncCfg.sid,{name:syncCfg.name,track:state.track,progress:state.progress});
    sync.status='synced';
  }catch(e){sync.status='error'}
  sync.busy=false;renderSyncNote();
  if(sync.again){sync.again=false;scheduleSync()}
}
async function pullSameName(data){
  var merged=state.progress;
  (data.students||[]).forEach(function(s){
    if(s&&s.progress&&sameName(s.name,syncCfg.name))merged=mergeProgress(merged,s.progress);
  });
  if(JSON.stringify(merged)!==JSON.stringify(state.progress)){
    state.progress=merged;
    store.set({track:state.track,progress:state.progress});
  }
}
async function startSync(){
  if(!API||!syncCfg.code)return;
  try{
    var data=await api('GET','/api/family/'+encodeURIComponent(syncCfg.code));
    if(syncCfg.name){await pullSameName(data);await push()}
  }catch(e){if(syncCfg.name)sync.status='error'}
  renderSyncNote();
  if(ui.view==='home'||ui.view==='parent')render(false);
}
async function refreshStudents(){
  if(!API||!syncCfg.code)return;
  try{
    var d=await api('GET','/api/family/'+encodeURIComponent(syncCfg.code));
    sync.students=d.students||[];sync.msg='';
  }catch(e){
    sync.msg=e.status===404?'That family code wasn’t found. Check it in Family sync.':'Couldn’t load progress right now. It will try again shortly.';
  }
  sync.loaded=true;
  refreshParent();
}
function startPoll(){
  if(sync.poll||!API||!syncCfg.code)return;
  refreshStudents();
  sync.poll=setInterval(function(){if(!document.hidden)refreshStudents()},60000);
}
function stopPoll(){if(sync.poll){clearInterval(sync.poll);sync.poll=0}}
function refreshParent(){
  if(ui.view!=='parent')return;
  $('#app').innerHTML=parentView();renderSyncNote();
}
function setErr(m){var el=$('#sync-err');if(el)el.textContent=m||''}
async function doCreate(){
  setErr('');
  try{
    var d=await api('POST','/api/family');
    syncCfg.code=d.code;saveCfg();sync.students=[];sync.loaded=false;
    render(false);
  }catch(e){setErr('Couldn’t create a code: '+e.message)}
}
async function doJoin(){
  var code=($('#sync-code-in')||{}).value||'',name=(($('#sync-name-in')||{}).value||'').trim().slice(0,24);
  if(!code.trim()||!name){setErr('Enter both the family code and a name.');return}
  setErr('');
  try{
    var d=await api('GET','/api/family/'+encodeURIComponent(code.trim()));
    syncCfg.code=d.code||code.trim();syncCfg.name=name;saveCfg();
    await pullSameName(d);
    sync.status='idle';
    await push();
    render(false);
  }catch(e){setErr(e.status===404?'That code wasn’t found. Check it and try again.':'Couldn’t join: '+e.message)}
}
async function doName(){
  var name=(($('#sync-name-in')||{}).value||'').trim().slice(0,24);
  if(!name){setErr('Enter a name to share progress from this device.');return}
  syncCfg.name=name;saveCfg();setErr('');
  try{var d=await api('GET','/api/family/'+encodeURIComponent(syncCfg.code));await pullSameName(d)}catch(e){}
  sync.status='idle';
  await push();
  render(false);
}
function doLeave(){
  syncCfg.code='';syncCfg.name='';saveCfg();
  stopPoll();sync.students=[];sync.loaded=false;sync.status='idle';
  render(false);
}
function doCopy(btn){
  var code=syncCfg.code||'';
  function done(){btn.textContent='Copied'}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,function(){selectCode()})}
  else selectCode();
  function selectCode(){
    var el=$('#sync-code');
    if(el&&window.getSelection){var r=document.createRange();r.selectNodeContents(el);var s2=getSelection();s2.removeAllRanges();s2.addRange(r)}
    btn.textContent='Press copy on your keyboard';
  }
}

function optBlock(n,step,pq){
  var opts=get(step.opts),locked=pq.stage>n,h='<fieldset class="q" data-n="'+n+'"><legend>'+step.label+'</legend>';
  opts.forEach(function(o,i){
    var isRight=i===step.correct,wrong=pq.wrong[n].indexOf(i)>=0,cls='opt',tag='';
    if(locked&&isRight){cls+=' right';tag='Correct'}
    else if(wrong){cls+=' wrong';tag='Not quite'}
    h+='<button class="'+cls+'" data-act="answer" data-s="'+n+'" data-i="'+i+'"'+((locked||wrong)?' disabled':'')+'><span>'+o+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</button>';
  });
  if(!locked&&pq.wrong[n].length)h+='<p class="hint" role="status">Not quite. Reread the question, look for clue words, and try again.</p>';
  return h+'</fieldset>';
}
function practiceView(l){

    h+='<div class="sum"><h3 tabindex="-1">Practice complete</h3><p>You picked the right tool and reason on the first try for <strong>'+right+' of '+l.questions.length+'</strong> questions.</p>';
    if(miss.length)h+='<p>Worth another look: '+miss.join('; ')+'.</p>';
    else h+='<p>Nothing to revisit. Nice work.</p>';
    h+='<div class="cta"><button class="btn primary" data-act="home">Back to course</button><button class="btn" data-act="again">Practice again</button></div></div>';
    return h;
  }

  h+='<p class="qmeta">Question '+(pq.qi+1)+' of '+l.questions.length+'</p><p class="prompt">'+q.prompt[state.track]+'</p>';

function progressTable(P){

    });

function groupStudents(list){
  var map={},order=[];

    if(!map[k]){map[k]={name:x.name||'Student',track:x.track,updatedAt:x.updatedAt||0,progress:x.progress||{}};order.push(k)}
    else{
      var g=map[k];
      g.progress=mergeProgress(g.progress,x.progress||{});
      if((x.updatedAt||0)>g.updatedAt){g.updatedAt=x.updatedAt;g.track=x.track}
    }
  });
  return order.map(function(k){return map[k]});
}
function studentBlock(st){
